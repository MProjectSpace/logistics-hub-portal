name: Auto Scraper Pelindo Data

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan scraper secara manual kapan saja dari tab Actions
  schedule:
    - cron: '0 */6 * * *' # Otomatis berjalan setiap 6 jam sekali

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Memberikan izin agar GitHub Actions bisa menyimpan file data.json ke repo Anda

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Scraper Script
        run: python scraper.py

      - name: Commit and Push updated data.json
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: auto-update vessel schedule data from Pelindo" && git push)
