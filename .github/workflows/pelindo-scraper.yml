```yaml
name: Pelindo TPKS Data Scraper

on:
  workflow_dispatch:

  schedule:
    # Setiap 30 menit
    # UTC 00:00 = 07:00 WIB
    - cron: "*/30 * * * *"

  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/pelindo-scraper.yml"

permissions:
  contents: write

jobs:

  scrape:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # Checkout repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ==================================================
      # Install dependencies
      # ==================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==================================================
      # Run scraper
      # ==================================================

      - name: Run Pelindo scraper
        run: |
          python scraper.py


      # ==================================================
      # Check generated data
      # ==================================================

      - name: Validate data.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data.json")

          if not path.exists():
              raise SystemExit("ERROR: data.json was not generated.")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("ERROR: data.json root must be an object.")

          print("data.json is valid JSON.")
          print("Top-level keys:")
          for key in data.keys():
              print(f" - {key}")
          PY


      # ==================================================
      # Show git status
      # ==================================================

      - name: Check changes
        run: |
          git status --short


      # ==================================================
      # Commit updated data.json
      # ==================================================

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Update Pelindo TPKS data"
            git push
          fi
```
