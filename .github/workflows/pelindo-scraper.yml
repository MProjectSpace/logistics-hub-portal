name: Pelindo TPKS Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/pelindo-scraper.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pelindo scraper
        run: |
          python scraper.py

      - name: Validate data.json
        run: |
          python - <<'PY'
          import json

          with open("data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "vesselAlongside",
              "confirmedVessel",
              "openStack",
              "vesselSchedule",
              "vesselHistory",
              "counts"
          ]

          missing = [
              key for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"Missing required keys: {missing}"
              )

          print("data.json validation passed.")

          for key in required[:-1]:
              print(
                  f"{key}: "
                  f"{len(data[key])}"
              )
          PY

      - name: Upload debug HTML
        uses: actions/upload-artifact@v4
        with:
          name: pelindo-debug-html
          path: debug_pelindo.html
          if-no-files-found: warn

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes to data.json."
            exit 0
          fi

          git commit -m "chore: update Pelindo TPKS data"

          echo "Fetching latest main..."
          git fetch origin main

          echo "Merging latest main..."
          git merge origin/main -X ours --no-edit

          echo "Pushing updated data.json..."
          git push origin main
