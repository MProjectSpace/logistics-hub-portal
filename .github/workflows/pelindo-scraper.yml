name: Pelindo TPKS Auto Scraper

'on':
  schedule:
    # Berjalan otomatis setiap 30 menit
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: |
          python scraper.py -i https://ibstpks.pelindo.co.id/webaccess/ -o data.json

      - name: Commit and Push Updated data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'auto: update Pelindo live vessel data [skip ci]'
          file_pattern: 'data.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
