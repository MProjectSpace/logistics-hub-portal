name: Pelindo TPKS Data Scraper

on:
  schedule:
    # Berjalan otomatis setiap 30 menit
    - cron: '*/30 * * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions GitHub
  push:
    branches:
      - main

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Run Pelindo Scraper
        run: |
          python scraper.py -i https://ibstpks.pelindo.co.id/webaccess/ -o data.json

      - name: Commit and Push Data JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update Pelindo vessel live data [skip ci]"
          file_pattern: "data.json"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com
