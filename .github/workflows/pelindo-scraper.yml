name: Pelindo Live Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Pelindo scraper
        run: |
          python scraper.py

      - name: Check generated data
        run: |
          python - <<'PY'
          import json

          with open("data.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Last Updated:", data["lastUpdated"])
          print("All Vessels:", len(data["allVessels"]))
          print("Alongside:", len(data["vesselAlongside"]))
          print("Confirmed:", len(data["confirmedVessel"]))
          print("Open Stack:", len(data["openStack"]))
          print("Schedule:", len(data["vesselSchedule"]))
          PY

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Update Pelindo vessel data"
            git push
          fi
