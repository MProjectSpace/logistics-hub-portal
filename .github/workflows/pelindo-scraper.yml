name: Pelindo TPKS Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/pelindo-scraper.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pelindo scraper
        run: |
          python scraper.py

      - name: Validate data.json
        run: |
          python - <<'PY'
          import json

          with open("data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "vesselAlongside",
              "confirmedVessel",
              "openStack",
              "vesselSchedule",
              "vesselHistory"
          ]

          for key in required:
              if key not in data:
                  raise SystemExit(
                      f"Missing required key: {key}"
                  )

          print("data.json validation passed.")

          print(
              "Total records:",
              sum(
                  len(data[key])
                  for key in required
              )
          )
          PY

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes to data.json."
            exit 0
          fi

          git commit -m "chore: update Pelindo TPKS data"

          echo "Syncing latest main branch..."
          git pull --rebase origin main

          echo "Pushing updated data.json..."
          git push origin main
