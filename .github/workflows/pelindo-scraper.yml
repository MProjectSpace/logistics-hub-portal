name: Pelindo TPKS Scraper

on:
  # ======================================================
  # MANUAL RUN
  # ======================================================

  workflow_dispatch:

  # ======================================================
  # RUN EVERY 30 MINUTES
  # ======================================================

  schedule:
    - cron: "*/30 * * * *"

  # ======================================================
  # RUN WHEN SCRAPER / DEPENDENCY / WORKFLOW CHANGES
  # ======================================================

  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/pelindo-scraper.yml"


# ==========================================================
# PREVENT MULTIPLE SCRAPER RUNS AT THE SAME TIME
# ==========================================================

concurrency:
  group: pelindo-tpks-scraper
  cancel-in-progress: false


# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  contents: write


jobs:

  scrape:

    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # 1. CHECKOUT
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ====================================================
      # 2. SETUP PYTHON
      # ====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ====================================================
      # 3. INSTALL PYTHON DEPENDENCIES
      # ====================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ====================================================
      # 4. INSTALL PLAYWRIGHT CHROMIUM
      # ====================================================

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium


      # ====================================================
      # 5. CHECK PELINDO CONNECTION
      # ====================================================

      - name: Check Pelindo connection
        continue-on-error: true
        run: |

          echo "======================================"
          echo "CHECKING PELINDO CONNECTION"
          echo "======================================"

          python - <<'PY'
          import urllib.request
          import sys

          URL = "https://ibstpks.pelindo.co.id/webaccess/"

          print(f"Testing: {URL}")

          try:

              request = urllib.request.Request(
                  URL,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 "
                          "(KHTML, like Gecko) "
                          "Chrome/140.0 Safari/537.36"
                      )
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      f"HTTP Status : {response.status}"
                  )

                  print(
                      "Content Type: "
                      f"{response.headers.get('Content-Type')}"
                  )

                  print(
                      "Pelindo connection check completed."
                  )

          except Exception as exc:

              print(
                  "WARNING: Pelindo connection check failed."
              )

              print(
                  f"Reason: {exc}"
              )

              print(
                  "Scraper akan tetap mencoba."
              )

              sys.exit(1)

          PY

          echo ""
          echo "======================================"


      # ====================================================
      # 6. RUN SCRAPER WITH RETRY
      # ====================================================

      - name: Run Pelindo scraper
        run: |

          echo "======================================"
          echo "STARTING PELINDO TPKS SCRAPER"
          echo "======================================"

          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do

            echo ""
            echo "======================================"
            echo "SCRAPER ATTEMPT $ATTEMPT / $MAX_ATTEMPTS"
            echo "======================================"

            if python scraper.py; then

              echo ""
              echo "======================================"
              echo "SCRAPER FINISHED SUCCESSFULLY"
              echo "======================================"

              exit 0

            fi

            echo ""
            echo "======================================"
            echo "SCRAPER ATTEMPT $ATTEMPT FAILED"
            echo "======================================"

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then

              echo ""
              echo "Waiting 15 seconds before retry..."

              sleep 15

            fi

            ATTEMPT=$((ATTEMPT + 1))

          done

          echo ""
          echo "======================================"
          echo "SCRAPER FAILED AFTER $MAX_ATTEMPTS ATTEMPTS"
          echo "======================================"

          exit 1


      # ====================================================
      # 7. VALIDATE DATA.JSON
      # ====================================================

      - name: Validate data.json
        run: |

          python - <<'PY'

          import json
          from pathlib import Path


          file = Path("data.json")


          print("======================================")
          print("VALIDATING DATA.JSON")
          print("======================================")


          # ------------------------------------------------
          # FILE EXISTENCE
          # ------------------------------------------------

          if not file.exists():

              raise SystemExit(
                  "ERROR: data.json tidak ditemukan."
              )


          # ------------------------------------------------
          # FILE SIZE
          # ------------------------------------------------

          if file.stat().st_size == 0:

              raise SystemExit(
                  "ERROR: data.json kosong."
              )


          print(
              f"File size    : "
              f"{file.stat().st_size} bytes"
          )


          # ------------------------------------------------
          # JSON SYNTAX
          # ------------------------------------------------

          try:

              with file.open(
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)

          except json.JSONDecodeError as exc:

              raise SystemExit(
                  f"ERROR: JSON tidak valid: {exc}"
              )


          # ------------------------------------------------
          # ROOT OBJECT
          # ------------------------------------------------

          if not isinstance(data, dict):

              raise SystemExit(
                  "ERROR: Root data.json "
                  "harus berupa object."
              )


          # ------------------------------------------------
          # REQUIRED KEYS
          # ------------------------------------------------

          required = [
              "lastUpdated",
              "updatedAt",
              "source",
              "vesselAlongside",
              "confirmedVessel",
              "openStack",
              "vesselSchedule",
              "vesselHistory",
              "counts"
          ]


          missing = [
              key
              for key in required
              if key not in data
          ]


          if missing:

              raise SystemExit(
                  f"ERROR: Missing required keys: {missing}"
              )


          # ------------------------------------------------
          # REQUIRED ARRAYS
          # ------------------------------------------------

          arrays = [
              "vesselAlongside",
              "confirmedVessel",
              "openStack",
              "vesselSchedule",
              "vesselHistory"
          ]


          for key in arrays:

              if not isinstance(
                  data[key],
                  list
              ):

                  raise SystemExit(
                      f"ERROR: '{key}' "
                      f"harus berupa array."
                  )


          # ------------------------------------------------
          # COUNTS OBJECT
          # ------------------------------------------------

          if not isinstance(
              data["counts"],
              dict
          ):

              raise SystemExit(
                  "ERROR: 'counts' "
                  "harus berupa object."
              )


          # ------------------------------------------------
          # VALIDATE COUNTS
          # ------------------------------------------------

          for key in arrays:

              if key not in data["counts"]:

                  raise SystemExit(
                      f"ERROR: counts['{key}'] "
                      f"tidak ditemukan."
                  )


              expected = len(
                  data[key]
              )

              actual = data["counts"][key]


              if actual != expected:

                  raise SystemExit(
                      f"ERROR: counts['{key}'] "
                      f"= {actual}, "
                      f"tetapi jumlah data "
                      f"= {expected}."
                  )


          # ------------------------------------------------
          # VALIDATE VESSEL RECORDS
          # ------------------------------------------------

          for section in arrays:

              for index, vessel in enumerate(
                  data[section]
              ):

                  if not isinstance(
                      vessel,
                      dict
                  ):

                      raise SystemExit(
                          f"ERROR: {section}[{index}] "
                          f"bukan object."
                      )


                  if "vesselName" not in vessel:

                      raise SystemExit(
                          f"ERROR: {section}[{index}] "
                          f"tidak memiliki vesselName."
                      )


          # ------------------------------------------------
          # VALIDATE SCHEDULE
          # ------------------------------------------------

          wrong_schedule = []


          for vessel in data["vesselSchedule"]:

              status = str(
                  vessel.get(
                      "mvSts",
                      ""
                  )
              ).strip().upper()


              if status and status != "SCHEDULE":

                  wrong_schedule.append(
                      (
                          vessel.get(
                              "vesselName",
                              "-"
                          ),
                          status
                      )
                  )


          if wrong_schedule:

              print("")
              print(
                  "WARNING: ditemukan record "
                  "Schedule dengan status berbeda:"
              )


              for vessel_name, status in \
                  wrong_schedule[:10]:

                  print(
                      f"  - {vessel_name} -> {status}"
                  )


          # ------------------------------------------------
          # VALIDATE HISTORY
          # ------------------------------------------------

          wrong_history = []


          for vessel in data["vesselHistory"]:

              status = str(
                  vessel.get(
                      "mvSts",
                      ""
                  )
              ).strip().upper()


              if status and status != "HISTORY":

                  wrong_history.append(
                      (
                          vessel.get(
                              "vesselName",
                              "-"
                          ),
                          status
                      )
                  )


          if wrong_history:

              print("")
              print(
                  "WARNING: ditemukan record "
                  "History dengan status berbeda:"
              )


              for vessel_name, status in \
                  wrong_history[:10]:

                  print(
                      f"  - {vessel_name} -> {status}"
                  )


          # ------------------------------------------------
          # SUCCESS
          # ------------------------------------------------

          print("")
          print("======================================")
          print("DATA.JSON VALIDATION PASSED")
          print("======================================")


          print(
              f"Last Updated : "
              f"{data['lastUpdated']}"
          )


          print(
              f"Updated At   : "
              f"{data['updatedAt']}"
          )


          print("")


          print(
              f"Alongside    : "
              f"{len(data['vesselAlongside'])}"
          )


          print(
              f"Confirmed    : "
              f"{len(data['confirmedVessel'])}"
          )


          print(
              f"Open Stack   : "
              f"{len(data['openStack'])}"
          )


          print(
              f"Schedule     : "
              f"{len(data['vesselSchedule'])}"
          )


          print(
              f"History      : "
              f"{len(data['vesselHistory'])}"
          )


          print("")
          print("======================================")

          PY


      # ====================================================
      # 8. SHOW GENERATED DATA
      # ====================================================

      - name: Show generated data.json
        run: |

          echo "======================================"
          echo "GENERATED DATA.JSON"
          echo "======================================"


          ls -lh data.json


          echo ""
          echo "Timestamp:"


          grep -E \
            '"lastUpdated"|"updatedAt"' \
            data.json || true


          echo ""
          echo "Git status BEFORE commit:"


          git status --short


          echo ""
          echo "======================================"


      # ====================================================
      # 9. UPLOAD DEBUG FILES
      # ====================================================

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pelindo-debug
          path: |
            debug_pelindo.html
            debug_pelindo.png
          if-no-files-found: ignore


      # ====================================================
      # 10. COMMIT DATA.JSON
      # ====================================================

      - name: Commit data.json
        run: |

          echo "======================================"
          echo "PREPARING GIT COMMIT"
          echo "======================================"


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------
          # ADD GENERATED DATA
          # ------------------------------------------------

          git add data.json


          # ------------------------------------------------
          # SHOW STAGED CHANGES
          # ------------------------------------------------

          echo ""
          echo "Git status AFTER git add:"


          git status --short


          echo ""
          echo "Staged changes:"


          git diff --cached --stat


          # ------------------------------------------------
          # CHECK CHANGES
          # ------------------------------------------------

          if git diff --cached --quiet; then

            echo ""
            echo "======================================"
            echo "NO CHANGES TO DATA.JSON"
            echo "======================================"

            exit 0

          fi


          # ------------------------------------------------
          # COMMIT
          # ------------------------------------------------

          echo ""
          echo "======================================"
          echo "COMMITTING DATA.JSON"
          echo "======================================"


          git commit \
            -m "chore: update Pelindo TPKS data"


          echo ""
          echo "COMMIT CREATED SUCCESSFULLY"


      # ====================================================
      # 11. SYNC AND PUSH
      # ====================================================

      - name: Sync and push data.json
        run: |

          echo "======================================"
          echo "SYNCING WITH REMOTE MAIN"
          echo "======================================"


          git fetch origin main


          echo ""
          echo "Remote commit:"
          git rev-parse origin/main


          echo ""
          echo "Local commit:"
          git rev-parse HEAD


          echo ""
          echo "Rebasing local commit onto origin/main..."


          git rebase origin/main


          echo ""
          echo "======================================"
          echo "PUSHING DATA.JSON TO MAIN"
          echo "======================================"


          git push origin HEAD:main


          echo ""
          echo "======================================"
          echo "PUSH SUCCESSFUL"
          echo "======================================"
