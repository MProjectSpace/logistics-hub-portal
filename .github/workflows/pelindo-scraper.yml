name: Pelindo TPKS Scraper

on:
  # Jalankan manual dari GitHub Actions
  workflow_dispatch:

  # Jalankan setiap 30 menit
  schedule:
    - cron: "*/30 * * * *"

  # Jalankan otomatis jika scraper/workflow/dependency berubah
  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/pelindo-scraper.yml"


permissions:
  contents: write


jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ======================================================
      # 3. INSTALL PYTHON DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 4. INSTALL PLAYWRIGHT CHROMIUM
      # ======================================================

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium


      # ======================================================
      # 5. RUN SCRAPER
      # ======================================================

      - name: Run Pelindo scraper
        run: |
          echo "======================================"
          echo "STARTING PELINDO TPKS SCRAPER"
          echo "======================================"

          python scraper.py

          echo ""
          echo "======================================"
          echo "SCRAPER FINISHED"
          echo "======================================"


      # ======================================================
      # 6. VALIDATE DATA.JSON
      # ======================================================

      - name: Validate data.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          file = Path("data.json")

          print("======================================")
          print("VALIDATING DATA.JSON")
          print("======================================")

          # --------------------------------------------------
          # File existence
          # --------------------------------------------------

          if not file.exists():
              raise SystemExit(
                  "ERROR: data.json tidak ditemukan."
              )

          # --------------------------------------------------
          # File size
          # --------------------------------------------------

          if file.stat().st_size == 0:
              raise SystemExit(
                  "ERROR: data.json kosong."
              )

          print(
              f"File size    : "
              f"{file.stat().st_size} bytes"
          )

          # --------------------------------------------------
          # JSON syntax
          # --------------------------------------------------

          try:
              with file.open(
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"ERROR: JSON tidak valid: {exc}"
              )

          # --------------------------------------------------
          # Root object
          # --------------------------------------------------

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: Root data.json harus berupa object."
              )

          # --------------------------------------------------
          # Required keys
          # --------------------------------------------------

          required = [
              "lastUpdated",
              "updatedAt",
              "source",
              "allVessels",
              "vesselAlongside",
              "anchorageVessel",
              "confirmedVessel",
              "openStack",
              "vesselSchedule",
              "vesselHistory",
              "counts"
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"ERROR: Missing required keys: {missing}"
              )

          # --------------------------------------------------
          # Required arrays
          # --------------------------------------------------

          arrays = [
              "allVessels",
              "vesselAlongside",
              "anchorageVessel",
              "confirmedVessel",
              "openStack",
              "vesselSchedule",
              "vesselHistory"
          ]

          for key in arrays:
              if not isinstance(data[key], list):
                  raise SystemExit(
                      f"ERROR: '{key}' harus berupa array."
                  )

          # --------------------------------------------------
          # Counts object
          # --------------------------------------------------

          if not isinstance(data["counts"], dict):
              raise SystemExit(
                  "ERROR: 'counts' harus berupa object."
              )

          # --------------------------------------------------
          # Validate counts
          # --------------------------------------------------

          count_mapping = {
              "allVessels": "allVessels",
              "vesselAlongside": "vesselAlongside",
              "anchorageVessel": "anchorageVessel",
              "confirmedVessel": "confirmedVessel",
              "openStack": "openStack",
              "vesselSchedule": "vesselSchedule",
              "vesselHistory": "vesselHistory"
          }

          for count_key, array_key in count_mapping.items():

              if count_key not in data["counts"]:
                  raise SystemExit(
                      f"ERROR: counts['{count_key}'] tidak ditemukan."
                  )

              expected = len(data[array_key])
              actual = data["counts"][count_key]

              if actual != expected:
                  raise SystemExit(
                      f"ERROR: counts['{count_key}'] "
                      f"= {actual}, tetapi jumlah data "
                      f"= {expected}."
                  )

          # --------------------------------------------------
          # Validate vessel records
          # --------------------------------------------------

          for section in arrays:

              for index, vessel in enumerate(
                  data[section]
              ):

                  if not isinstance(vessel, dict):
                      raise SystemExit(
                          f"ERROR: {section}[{index}] "
                          f"bukan object."
                      )

                  if "vesselName" not in vessel:
                      raise SystemExit(
                          f"ERROR: {section}[{index}] "
                          f"tidak memiliki vesselName."
                      )

          # --------------------------------------------------
          # Validate Schedule
          # --------------------------------------------------

          wrong_schedule = []

          for vessel in data["vesselSchedule"]:

              status = str(
                  vessel.get("mvSts", "")
              ).strip().upper()

              if status and status != "SCHEDULE":
                  wrong_schedule.append(
                      (
                          vessel.get(
                              "vesselName",
                              "-"
                          ),
                          status
                      )
                  )

          if wrong_schedule:
              print("")
              print(
                  "WARNING: ditemukan record Schedule "
                  "dengan status berbeda:"
              )

              for vessel_name, status in wrong_schedule[:10]:
                  print(
                      f"  - {vessel_name} -> {status}"
                  )

          # --------------------------------------------------
          # Validate History
          # --------------------------------------------------

          wrong_history = []

          for vessel in data["vesselHistory"]:

              status = str(
                  vessel.get("mvSts", "")
              ).strip().upper()

              if status and status != "HISTORY":
                  wrong_history.append(
                      (
                          vessel.get(
                              "vesselName",
                              "-"
                          ),
                          status
                      )
                  )

          if wrong_history:
              print("")
              print(
                  "WARNING: ditemukan record History "
                  "dengan status berbeda:"
              )

              for vessel_name, status in wrong_history[:10]:
                  print(
                      f"  - {vessel_name} -> {status}"
                  )

          # --------------------------------------------------
          # Success
          # --------------------------------------------------

          print("")
          print("======================================")
          print("DATA.JSON VALIDATION PASSED")
          print("======================================")

          print(
              f"Last Updated : "
              f"{data['lastUpdated']}"
          )

          print(
              f"Updated At   : "
              f"{data['updatedAt']}"
          )

          print("")
          print(
              f"Alongside    : "
              f"{len(data['vesselAlongside'])}"
          )

          print(
              f"Anchorage    : "
              f"{len(data['anchorageVessel'])}"
          )

          print(
              f"Confirmed    : "
              f"{len(data['confirmedVessel'])}"
          )

          print(
              f"Open Stack   : "
              f"{len(data['openStack'])}"
          )

          print(
              f"Schedule     : "
              f"{len(data['vesselSchedule'])}"
          )

          print(
              f"History      : "
              f"{len(data['vesselHistory'])}"
          )

          print(
              f"All Vessels  : "
              f"{len(data['allVessels'])}"
          )

          print("")
          print("======================================")
          PY


      # ======================================================
      # 7. SHOW GENERATED DATA
      # ======================================================

      - name: Show generated data.json
        run: |
          echo "======================================"
          echo "GENERATED DATA.JSON"
          echo "======================================"

          ls -lh data.json

          echo ""
          echo "Timestamp:"
          grep -E '"lastUpdated"|"updatedAt"' data.json || true

          echo ""
          echo "Git status BEFORE commit:"
          git status --short

          echo ""
          echo "======================================"


      # ======================================================
      # 8. UPLOAD DEBUG HTML
      # ======================================================

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pelindo-debug-html
          path: debug_pelindo.html
          if-no-files-found: ignore


      # ======================================================
      # 9. COMMIT DATA.JSON
      # ======================================================

      - name: Commit data.json
        run: |
          echo "======================================"
          echo "PREPARING GIT COMMIT"
          echo "======================================"

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # --------------------------------------------------
          # Add generated data
          # --------------------------------------------------

          git add data.json

          # --------------------------------------------------
          # Show staged changes
          # --------------------------------------------------

          echo ""
          echo "Git status AFTER git add:"
          git status --short

          echo ""
          echo "Staged changes:"
          git diff --cached --stat

          # --------------------------------------------------
          # Check changes
          # --------------------------------------------------

          if git diff --cached --quiet; then

            echo ""
            echo "======================================"
            echo "NO CHANGES TO DATA.JSON"
            echo "======================================"

            exit 0

          fi

          # --------------------------------------------------
          # Commit
          # --------------------------------------------------

          echo ""
          echo "======================================"
          echo "COMMITTING DATA.JSON"
          echo "======================================"

          git commit \
            -m "chore: update Pelindo TPKS data"

          echo ""
          echo "COMMIT CREATED SUCCESSFULLY"


      # ======================================================
      # 10. PUSH DATA.JSON
      # ======================================================

      - name: Push data.json
        run: |
          echo "======================================"
          echo "PUSHING DATA.JSON TO MAIN"
          echo "======================================"

          git push origin HEAD:main

          echo ""
          echo "======================================"
          echo "PUSH SUCCESSFUL"
          echo "======================================"
