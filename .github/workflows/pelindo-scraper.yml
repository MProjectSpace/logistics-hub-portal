name: Pelindo TPKS Auto Scraper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pelindo-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Scraper Script
        run: python scraper.py -i https://ibstpks.pelindo.co.id/webaccess/ -o data.json
      - name: Commit and Push Updated data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'auto: update Pelindo live vessel data [skip ci]'
          file_pattern: data.json
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
