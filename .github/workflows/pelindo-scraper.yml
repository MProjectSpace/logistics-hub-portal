name: Pelindo TPKS Scraper

on:
  workflow_dispatch:

  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"

  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "requirements.txt"
      - ".github/workflows/pelindo-scraper.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pelindo scraper
        run: |
          python scraper.py

      - name: Validate data.json
        run: |
          python - <<'PY'
          import json

          with open("data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          required_keys = [
              "vesselAlongside",
              "confirmedVessel",
              "openStack",
              "vesselSchedule",
              "vesselHistory",
              "counts"
          ]

          missing = [key for key in required_keys if key not in data]

          if missing:
              raise SystemExit(
                  f"data.json missing required keys: {', '.join(missing)}"
              )

          for key in required_keys[:-1]:
              if not isinstance(data[key], list):
                  raise SystemExit(
                      f"{key} must be an array/list"
                  )

          if not isinstance(data["counts"], dict):
              raise SystemExit("counts must be an object")

          print("data.json validation: OK")
          print(
              "Counts:",
              {
                  key: len(data[key])
                  for key in required_keys[:-1]
              }
          )
          PY

      - name: Check generated data
        run: |
          echo "Generated data.json:"
          ls -lh data.json

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update Pelindo TPKS data"
            git push
          fi
