<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TPKS Vessel Monitoring</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                linear-gradient(
                    180deg,
                    #f8fafc 0%,
                    #f1f5f9 45%,
                    #f8fafc 100%
                );
            color: #0f172a;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        /* =========================================================
           HEADER UTAMA
           TIDAK STICKY
           ========================================================= */

        .main-header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        /* =========================================================
           SEARCH
           ========================================================= */

        .search-section {
            position: relative;
            z-index: 40;
        }

        .search-wrapper {
            position: relative;
            z-index: 50;
        }

        .search-input {
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background-color 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #94a3b8;
            box-shadow:
                0 0 0 3px rgba(148, 163, 184, 0.18);
            background: #ffffff;
        }

        .search-suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            z-index: 100;
            overflow: hidden;

            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #e2e8f0;
            border-radius: 14px;

            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.12),
                0 4px 12px rgba(15, 23, 42, 0.06);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .suggestion-item {
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            background: transparent;
            border: 0;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .suggestion-item:hover,
        .suggestion-item.active {
            background: #f8fafc;
        }

        .suggestion-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .suggestion-vessel {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggestion-meta {
            margin-top: 3px;
            padding-left: 20px;
            font-size: 11px;
            color: #64748b;
        }

        /* =========================================================
           KPI
           ========================================================= */

        .statistics-wrapper {
            position: relative;
            z-index: 10;
        }

        .stat-card {
            position: relative;
            z-index: 1;

            width: 100%;
            border: 1px solid #e2e8f0;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 14px;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: #cbd5e1;
            background: #ffffff;
            box-shadow:
                0 10px 25px rgba(15, 23, 42, 0.07);
        }

        /* =========================================================
           SECTION
           
           PENTING:
           Section TIDAK diberi overflow hidden/auto.
           Sticky section header harus mengikuti scroll halaman.
           ========================================================= */

        .dashboard-section {
            position: relative;
            scroll-margin-top: 8px;

            /* Jangan gunakan overflow:hidden/auto di sini */
            overflow: visible;
        }

        .section-card {
            position: relative;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;

            box-shadow:
                0 2px 8px rgba(15, 23, 42, 0.035);
        }

        /*
         * HEADER SECTION STICKY
         *
         * Header utama tidak sticky.
         * Karena itu section header cukup top: 0.
         *
         * Ketika Open Stack sedang panjang:
         *
         * OPEN STACK
         * ─────────────────────────
         * Vessel | Voyage | ...
         * ─────────────────────────
         * data
         * data
         * data
         *
         * Header Open Stack tetap berada di atas.
         */
        .section-header {
            position: sticky;
            top: 0;
            z-index: 30;

            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            padding: 14px 18px;

            background: rgba(255, 255, 255, 0.97);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid #e2e8f0;
        }

        .section-header-left {
            min-width: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 9px;

            margin: 0;

            font-size: 15px;
            line-height: 20px;
            font-weight: 750;
            letter-spacing: -0.01em;
            color: #0f172a;
        }

        .section-title-icon {
            width: 30px;
            height: 30px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;
            background: #f1f5f9;
            color: #475569;

            flex: 0 0 auto;
        }

        .section-subtitle {
            margin: 3px 0 0 39px;

            font-size: 11px;
            line-height: 16px;
            color: #64748b;
        }

        .section-count {
            flex: 0 0 auto;

            padding: 5px 9px;

            border: 1px solid #e2e8f0;
            border-radius: 999px;

            background: #f8fafc;

            font-size: 11px;
            font-weight: 700;
            color: #475569;
        }

        /* =========================================================
           TABLE
           ========================================================= */

        .section-scroll {
            width: 100%;

            /*
             * Hanya horizontal scroll jika diperlukan.
             * Jangan beri vertical overflow / max-height.
             */
            overflow-x: auto;
            overflow-y: visible;

            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 760px;

            border-collapse: separate;
            border-spacing: 0;

            font-size: 12px;
        }

        /*
         * TABLE HEADER STICKY
         *
         * Karena section-header tingginya sekitar 68px,
         * header tabel berada di bawahnya.
         */
        .section-scroll thead {
            position: sticky;
            top: 68px;
            z-index: 20;
        }

        .section-scroll thead th {
            padding: 10px 14px;

            background: #f8fafc;

            border-bottom: 1px solid #e2e8f0;

            color: #64748b;
            font-size: 10px;
            font-weight: 750;
            letter-spacing: 0.045em;
            text-transform: uppercase;

            white-space: nowrap;
            text-align: left;
        }

        .section-scroll tbody td {
            padding: 11px 14px;

            border-bottom: 1px solid #f1f5f9;

            color: #334155;
            vertical-align: middle;

            white-space: nowrap;
        }

        .section-scroll tbody tr {
            background: #ffffff;
            transition:
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .section-scroll tbody tr:nth-child(even) {
            background: #fcfdff;
        }

        .section-scroll tbody tr:hover {
            background: #f8fafc;
        }

        .section-scroll tbody tr:last-child td {
            border-bottom: 0;
        }

        .vessel-main {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 150px;
        }

        .vessel-name {
            font-weight: 700;
            color: #0f172a;
        }

        .vessel-code {
            font-size: 10px;
            color: #94a3b8;
            letter-spacing: 0.025em;
        }

        .voyage-text {
            font-weight: 650;
            color: #334155;
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 4px 8px;

            border: 1px solid #e2e8f0;
            border-radius: 999px;

            background: #f8fafc;

            color: #475569;
            font-size: 10px;
            font-weight: 700;
        }

        .type-dot {
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: #94a3b8;
        }

        .datetime-text {
            color: #475569;
            font-variant-numeric: tabular-nums;
        }

        .number-text {
            color: #334155;
            font-weight: 650;
            font-variant-numeric: tabular-nums;
        }

        .muted-text {
            color: #94a3b8;
        }

        .empty-section {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        /* =========================================================
           SEARCH RESULT HIGHLIGHT
           ========================================================= */

        .search-hit td {
            animation: searchHit 2.8s ease both;
        }

        .search-hit td:first-child {
            box-shadow:
                inset 4px 0 0 #2563eb !important;
        }

        @keyframes searchHit {
            0% {
                background: #dbeafe !important;
            }

            20% {
                background: #eff6ff !important;
            }

            55% {
                background: #eff6ff !important;
            }

            100% {
                background: inherit;
            }
        }

        /* =========================================================
           MODAL
           ========================================================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-panel {
            width: min(720px, 100%);
            max-height: 88vh;

            overflow-y: auto;

            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;

            box-shadow:
                0 30px 80px rgba(15, 23, 42, 0.2);
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 10;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;

            padding: 18px 20px;

            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border-bottom: 1px solid #e2e8f0;
        }

        .modal-title {
            margin: 0;

            font-size: 17px;
            font-weight: 750;
            color: #0f172a;
        }

        .modal-subtitle {
            margin-top: 3px;

            font-size: 11px;
            color: #64748b;
        }

        .modal-close {
            width: 34px;
            height: 34px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            flex: 0 0 auto;

            border: 0;
            border-radius: 10px;

            background: #f1f5f9;
            color: #64748b;

            cursor: pointer;

            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .modal-close:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .modal-body {
            padding: 18px 20px 22px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .detail-item {
            padding: 11px 12px;

            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 10px;
        }

        .detail-label {
            margin-bottom: 4px;

            font-size: 9px;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: 0.05em;

            color: #94a3b8;
        }

        .detail-value {
            font-size: 12px;
            font-weight: 650;
            color: #334155;

            word-break: break-word;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 768px) {
            .section-header {
                min-height: 62px;
                padding: 12px 14px;
            }

            .section-scroll thead {
                top: 62px;
            }

            .section-title {
                font-size: 14px;
            }

            .section-subtitle {
                display: none;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .modal-backdrop {
                padding: 10px;
            }

            .modal-panel {
                max-height: 92vh;
            }
        }

        /* =========================================================
           CONNECTION STATUS
           ========================================================= */

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #22c55e;
        }

        .status-dot.offline {
            background: #ef4444;
        }

        .status-dot.loading {
            background: #f59e0b;
        }

        .pulse-dot {
            animation: pulseDot 1.8s infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.45;
            }
        }

        /* =========================================================
           SCROLLBAR
           ========================================================= */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body>

    <!-- =========================================================
         HEADER UTAMA
         
         TIDAK STICKY.
         Header ini akan ikut hilang ketika halaman di-scroll.
         ========================================================= -->

    <header class="main-header border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="py-5 flex items-center justify-between gap-4">

                <div class="min-w-0">
                    <div class="flex items-center gap-3">
                        <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">
                            TPKS Vessel Monitoring
                        </h1>

                        <span
                            class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full bg-emerald-50 border border-emerald-100 text-emerald-700 text-[10px] font-bold"
                        >
                            <span
                                id="liveDot"
                                class="status-dot pulse-dot"
                            ></span>
                            Live
                        </span>
                    </div>

                    <p class="mt-1 text-xs text-slate-500">
                        Pelindo Terminal Petikemas Semarang
                    </p>
                </div>

                <div class="hidden sm:flex items-center gap-2">
                    <span
                        id="connectionText"
                        class="text-[10px] text-slate-400"
                    >
                        Connecting...
                    </span>
                </div>

            </div>
        </div>
    </header>


    <!-- =========================================================
         MAIN
         ========================================================= -->

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- =====================================================
             SEARCH
             ===================================================== -->

        <section class="search-section mb-5">

            <div class="search-wrapper">

                <div class="flex flex-col sm:flex-row gap-2">

                    <div class="relative flex-1">

                        <button
                            id="searchButtonIcon"
                            type="button"
                            onclick="performSearch()"
                            class="absolute left-3 top-1/2 -translate-y-1/2 z-10 text-slate-400 hover:text-slate-700 transition"
                            aria-label="Search"
                        >
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </button>

                        <input
                            id="searchInput"
                            type="text"
                            autocomplete="off"
                            placeholder="Search vessel, voyage, code, type..."
                            class="search-input w-full h-11 pl-10 pr-10 rounded-xl border border-slate-200 bg-white/90 text-sm text-slate-800 placeholder:text-slate-400"
                        >

                        <button
                            id="clearSearchButton"
                            type="button"
                            onclick="clearSearch()"
                            class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition"
                            aria-label="Clear search"
                        >
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>

                        <!-- SEARCH SUGGESTIONS -->

                        <div
                            id="searchSuggestions"
                            class="search-suggestions hidden"
                        ></div>

                    </div>

                    <button
                        type="button"
                        onclick="performSearch()"
                        class="h-11 px-5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold transition flex items-center justify-center gap-2"
                    >
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Search
                    </button>

                    <button
                        type="button"
                        onclick="loadData()"
                        class="h-11 px-5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold transition flex items-center justify-center gap-2"
                    >
                        <i class="fa-solid fa-rotate-right"></i>
                        Refresh
                    </button>

                </div>

            </div>

            <div class="mt-2 flex items-center justify-between gap-3">
                <p
                    id="searchStatus"
                    class="text-[10px] text-slate-400"
                ></p>

                <p
                    id="freshnessText"
                    class="text-[10px] text-slate-400 text-right"
                >
                    —
                </p>
            </div>

        </section>


        <!-- =====================================================
             STATISTICS / KPI
             ===================================================== -->

        <section
            id="statistics"
            class="statistics-wrapper mb-7"
        >
            <div
                id="statisticsGrid"
                class="grid grid-cols-2 lg:grid-cols-5 gap-3"
            ></div>
        </section>


        <!-- =====================================================
             DATA SECTIONS
             ===================================================== -->

        <div
            id="dashboardSections"
            class="space-y-5"
        ></div>


        <!-- =====================================================
             FOOTER STATUS
             ===================================================== -->

        <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-[10px] text-slate-400">

            <div>
                Source:
                <a
                    id="sourceLink"
                    href="https://ibstpks.pelindo.co.id/webaccess/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="hover:text-slate-600 underline underline-offset-2"
                >
                    Pelindo TPKS Webaccess
                </a>
            </div>

            <div class="flex items-center gap-2">
                <span>Last update:</span>
                <span id="lastUpdateText">—</span>
            </div>

            <div>
                Next scraper:
                <span id="nextUpdateText">—</span>
            </div>

        </div>

    </main>


    <!-- =========================================================
         MODAL
         ========================================================= -->

    <div
        id="vesselModal"
        class="modal-backdrop hidden"
    >

        <div
            id="modalPanel"
            class="modal-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >

            <div class="modal-header">

                <div class="min-w-0">
                    <h2
                        id="modalTitle"
                        class="modal-title"
                    >
                        Vessel Detail
                    </h2>

                    <div
                        id="modalSubtitle"
                        class="modal-subtitle"
                    ></div>
                </div>

                <button
                    type="button"
                    onclick="closeModal()"
                    class="modal-close"
                    aria-label="Close"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <div
                id="modalBody"
                class="modal-body"
            ></div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        const DATA_URL = "./data.json";

        let CURRENT_DATA = null;
        let CURRENT_SEARCH = "";
        let SEARCH_RESULTS = [];
        let ACTIVE_SUGGESTION = -1;


        /* =========================================================
           SECTION CONFIG
           ========================================================= */

        const SECTION_CONFIG = [
            {
                key: "vesselAlongside",
                title: "Vessel Alongside",
                icon: "fa-ship",
                subtitle: "Vessel currently alongside",
                columns: [
                    ["vesselName", "Vessel", "vessel"],
                    ["voyage", "Voyage", "voyage"],
                    ["type", "Type", "type"],
                    ["atb", "ATB", "datetime"],
                    ["etd", "ETD", "datetime"]
                ]
            },
            {
                key: "confirmedVessel",
                title: "Confirmed Vessel",
                icon: "fa-circle-check",
                subtitle: "Confirmed vessel information",
                columns: [
                    ["vesselName", "Vessel", "vessel"],
                    ["voyage", "Voyage", "voyage"],
                    ["type", "Type", "type"],
                    ["eta", "ETA", "datetime"],
                    ["etb", "ETB", "datetime"],
                    ["etd", "ETD", "datetime"]
                ]
            },
            {
                key: "openStack",
                title: "Open Stack",
                icon: "fa-box-open",
                subtitle: "Vessel with export receiving / open stack information",
                columns: [
                    ["vesselName", "Vessel", "vessel"],
                    ["voyage", "Voyage", "voyage"],
                    ["type", "Type", "type"],
                    ["openStack", "Open Stack", "datetime"],
                    ["closingTime", "Closing Time", "datetime"]
                ]
            },
            {
                key: "vesselSchedule",
                title: "Vessel Schedule",
                icon: "fa-calendar-days",
                subtitle: "Scheduled vessel information",
                columns: [
                    ["vesselName", "Vessel", "vessel"],
                    ["voyage", "Voyage", "voyage"],
                    ["type", "Type", "type"],
                    ["eta", "ETA", "datetime"],
                    ["etb", "ETB", "datetime"],
                    ["etd", "ETD", "datetime"]
                ]
            },
            {
                key: "vesselHistory",
                title: "Vessel History",
                icon: "fa-clock-rotate-left",
                subtitle: "Vessel historical records",
                columns: [
                    ["vesselName", "Vessel", "vessel"],
                    ["voyage", "Voyage", "voyage"],
                    ["type", "Type", "type"],
                    ["atb", "ATB", "datetime"],
                    ["atd", "ATD", "datetime"]
                ]
            }
        ];


        /* =========================================================
           HELPERS
           ========================================================= */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function normalizeSearchValue(value) {

            return String(value ?? "")
                .toLowerCase()
                .trim()
                .replace(/\s+/g, " ");
        }


        function formatDateTime(value) {

            if (
                value === null ||
                value === undefined ||
                String(value).trim() === ""
            ) {
                return "—";
            }

            return String(value);
        }


        function formatNumber(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "—";
            }

            const number = Number(
                String(value).replace(/,/g, "")
            );

            if (!Number.isFinite(number)) {
                return escapeHtml(value);
            }

            return number.toLocaleString("en-US");
        }


        function sectionByKey(sectionKey) {

            return SECTION_CONFIG.find(
                item => item.key === sectionKey
            );
        }


        function getSectionData(sectionKey) {

            if (!CURRENT_DATA) {
                return [];
            }

            return Array.isArray(CURRENT_DATA[sectionKey])
                ? CURRENT_DATA[sectionKey]
                : [];
        }


        /* =========================================================
           SEARCH KEY
           
           Vessel name + vessel code + voyage + section
           membuat voyage berbeda tetap dianggap berbeda.
           ========================================================= */

        function getVesselKey(vessel, sectionKey) {

            return [
                sectionKey,
                vessel?.vesId || "",
                vessel?.vesselName || "",
                vessel?.vesselCode || "",
                vessel?.voyage || ""
            ]
                .map(normalizeSearchValue)
                .join("|");
        }


        function getSearchFields(vessel, sectionKey) {

            const section = sectionByKey(sectionKey);

            const values = [];

            if (section) {
                values.push(section.title);
            }

            if (vessel && typeof vessel === "object") {

                Object.entries(vessel).forEach(
                    ([key, value]) => {

                        if (
                            value !== null &&
                            value !== undefined &&
                            typeof value !== "object"
                        ) {
                            values.push(value);
                        }

                    }
                );

            }

            return normalizeSearchValue(
                values.join(" ")
            );
        }


        function vesselMatches(vessel, sectionKey, query) {

            if (!query) {
                return true;
            }

            return getSearchFields(
                vessel,
                sectionKey
            ).includes(
                normalizeSearchValue(query)
            );
        }


        /* =========================================================
           SEARCH SUGGESTIONS
           ========================================================= */

        function buildSuggestions(query) {

            const q = normalizeSearchValue(query);

            if (!q || !CURRENT_DATA) {
                return [];
            }

            const results = [];

            SECTION_CONFIG.forEach(section => {

                const vessels = getSectionData(section.key);

                vessels.forEach(vessel => {

                    if (!vesselMatches(
                        vessel,
                        section.key,
                        q
                    )) {
                        return;
                    }

                    const name =
                        normalizeSearchValue(
                            vessel?.vesselName
                        );

                    const code =
                        normalizeSearchValue(
                            vessel?.vesselCode
                        );

                    const voyage =
                        normalizeSearchValue(
                            vessel?.voyage
                        );

                    const combined =
                        `${name} ${code} ${voyage}`;

                    let priority = 5;

                    if (name === q) {
                        priority = 0;
                    }
                    else if (
                        combined === q
                    ) {
                        priority = 1;
                    }
                    else if (
                        code === q ||
                        voyage === q
                    ) {
                        priority = 2;
                    }
                    else if (
                        name.startsWith(q) ||
                        code.startsWith(q) ||
                        voyage.startsWith(q)
                    ) {
                        priority = 3;
                    }

                    results.push({
                        vessel,
                        sectionKey: section.key,
                        priority
                    });

                });

            });

            results.sort((a, b) => {

                if (a.priority !== b.priority) {
                    return a.priority - b.priority;
                }

                const aName =
                    normalizeSearchValue(
                        a.vessel?.vesselName
                    );

                const bName =
                    normalizeSearchValue(
                        b.vessel?.vesselName
                    );

                return aName.localeCompare(bName);

            });

            /*
             * Hindari suggestion duplikat.
             * Voyage berbeda tetap berbeda.
             */

            const unique = [];
            const seen = new Set();

            results.forEach(result => {

                const key = getVesselKey(
                    result.vessel,
                    result.sectionKey
                );

                if (!seen.has(key)) {

                    seen.add(key);
                    unique.push(result);

                }

            });

            return unique.slice(0, 8);
        }


        function renderSuggestions(query) {

            const container =
                document.getElementById(
                    "searchSuggestions"
                );

            const suggestions =
                buildSuggestions(query);

            SEARCH_RESULTS = suggestions;

            ACTIVE_SUGGESTION = -1;

            if (!query || suggestions.length === 0) {

                container.innerHTML = "";
                container.classList.add("hidden");

                return;
            }

            container.innerHTML =
                suggestions.map(
                    (item, index) => {

                        const vessel =
                            item.vessel;

                        const section =
                            sectionByKey(
                                item.sectionKey
                            );

                        const name =
                            vessel?.vesselName ||
                            "Unnamed Vessel";

                        const code =
                            vessel?.vesselCode ||
                            "—";

                        const voyage =
                            vessel?.voyage ||
                            "—";

                        return `
                            <button
                                type="button"
                                class="suggestion-item"
                                data-index="${index}"
                                onmousedown="selectSuggestion(${index})"
                            >
                                <div class="suggestion-title">
                                    <i class="fa-solid fa-ship text-[11px] text-slate-400"></i>

                                    <span class="suggestion-vessel">
                                        ${escapeHtml(name)}
                                    </span>
                                </div>

                                <div class="suggestion-meta">
                                    ${escapeHtml(code)}
                                    · Voyage ${escapeHtml(voyage)}
                                    · ${escapeHtml(section?.title || "")}
                                </div>
                            </button>
                        `;

                    }
                )
                .join("");

            container.classList.remove("hidden");
        }


        function selectSuggestion(index) {

            const result =

            if (!result) {

            }

            const vessel =

            const input =

            CURRENT_SEARCH = input.value;

            document
                .getElementById("searchSuggestions")
                .classList.add("hidden");

            document
                .getElementById("clearSearchButton")
                .classList.remove("hidden");

            renderAllSections();

            setTimeout(() => {

        /* =========================================================
           FIND SEARCH RESULT
           ========================================================= */

        function findFirstSearchResult(query) {

            if (!CURRENT_DATA || !query) {
                return null;
            }

            const q =
                normalizeSearchValue(query);

            /*
             * Prioritas 1:
             * exact vessel name + voyage
             */

            for (const section of SECTION_CONFIG) {

                for (const vessel of getSectionData(section.key)) {

                    const name =
                        normalizeSearchValue(
                            vessel?.vesselName
                        );

                    const voyage =
                        normalizeSearchValue(
                            vessel?.voyage
                        );

                    const code =
                        normalizeSearchValue(
                            vessel?.vesselCode
                        );

                    const combinations = [
                        `${name} ${voyage}`,
                        `${name} ${code}`,
                        `${name} ${code} ${voyage}`
                    ];

                    if (
                        combinations.some(
                            combination =>
                                combination === q
                        )
                    ) {
                        return {
                            vessel,
                            sectionKey: section.key
                        };
                    }

                }

            }

            /*
             * Prioritas 2:
             * exact field
             */

            for (const section of SECTION_CONFIG) {

                for (const vessel of getSectionData(section.key)) {

                    const fields = [
                        vessel?.vesselName,
                        vessel?.vesselCode,
                        vessel?.voyage
                    ]
                        .filter(Boolean)
                        .map(normalizeSearchValue);

                    if (fields.includes(q)) {

                        return {
                            vessel,
                            sectionKey: section.key
                        };

                    }

                }

            }

            /*
             * Prioritas 3:
             * general search
             */

            for (const section of SECTION_CONFIG) {

                for (const vessel of getSectionData(section.key)) {

                    if (
                        vesselMatches(
                            vessel,
                            section.key,
                            q
                        )
                    ) {
                        return {
                            vessel,
                            sectionKey: section.key
                        };
                    }

                }

            }

            return null;
        }


        function performSearch() {

            const input =

                );

            const query =
                input.value.trim();

            CURRENT_SEARCH = query;

            document

            if (!query) {

            document
                .getElementById(

            renderAllSections();

            const result =
                findFirstSearchResult(query);

            if (!result) {

                    "Data tidak ditemukan.";

                return;
            }

            document
                .getElementById(

            setTimeout(() => {

                    result.vessel,

            }, 50);

        function jumpToSearchResult(
            vessel,
            sectionKey,
            highlight = true
        ) {

            const key =
                getVesselKey(
                    vessel,
                    sectionKey

            const row =
                document.querySelector(
                    `[data-vessel-key="${CSS.escape(key)}"]`
                );

            if (!row) {
                return;

            row.scrollIntoView({
                behavior: "smooth",
                block: "center"

            if (highlight) {

                row.classList.remove(
                    "search-hit"
                );

                /*
                 * Force reflow agar animation
                 * bisa dimainkan kembali.
                 */

                void row.offsetWidth;

                row.classList.add(
                    "search-hit"
                );

                setTimeout(() => {

                    row.classList.remove(
                        "search-hit"
                    );

                }, 3000);
            }
        }

        function renderSection(
            container,
            section,
            data
        ) {

            const sectionElement =
                document.createElement("section");

            sectionElement.id =
                `section-${section.key}`;

            sectionElement.className =
                "section-card dashboard-section";


            /*
             * HEADER SECTION

             * STICKY.

             * Header utama tidak sticky sehingga
             * section header akan menempel ke

             */

                document.createElement("div");

            header.className =
                "section-header";


            const headerLeft =

            headerLeft.className =

            const title =

            title.className =

            title.innerHTML = `

            const subtitle =
                document.createElement("p");

            subtitle.className =
                "section-subtitle";

            subtitle.textContent =
                section.subtitle;


            headerLeft.appendChild(title);
            headerLeft.appendChild(subtitle);


            const count =
                document.createElement("div");

            count.className =
                "section-count";

            count.textContent =
                `${data.length} record${data.length === 1 ? "" : "s"}`;


            header.appendChild(headerLeft);
            header.appendChild(count);


            sectionElement.appendChild(header);


            /*
             * TABLE
             */

            const scroll =
                document.createElement("div");

            scroll.className =
                "section-scroll";


            if (!data.length) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "empty-section";

                empty.innerHTML = `
                    <i class="fa-regular fa-folder-open mb-2 text-base"></i>
                    <div>No data available</div>
                `;

                scroll.appendChild(empty);

            }
            else {

                const table =
                    document.createElement("table");

                const thead =
                    document.createElement("thead");

                const headerRow =
                    document.createElement("tr");


                section.columns.forEach(
                    column => {

                        const th =
                            document.createElement("th");

                        th.textContent =
                            column[1];

                        headerRow.appendChild(th);

                    }
                );


                thead.appendChild(headerRow);
                table.appendChild(thead);


                const tbody =
                    document.createElement("tbody");


                data.forEach(vessel => {

                    const row =
                        renderTableRow(
                            vessel,
                            section
                        );

                    tbody.appendChild(row);

                });


                table.appendChild(tbody);
                scroll.appendChild(table);

            }


            sectionElement.appendChild(scroll);
            container.appendChild(sectionElement);
        }


        function renderTableRow(
            vessel,
            section
        ) {

            const row =
                document.createElement("tr");

            row.style.cursor = "pointer";

            row.dataset.vesselKey =
                getVesselKey(
                    vessel,
                    section.key
                );


            row.addEventListener(
                "click",
                () => openVesselModal(
                    vessel,
                    section
                )
            );


            section.columns.forEach(
                column => {

                    const [
                        field,
                        label,
                        type
                    ] = column;

                    const td =
                        document.createElement("td");

                    td.innerHTML =
                        renderCell(
                            vessel,
                            field,
                            type
                        );

                    row.appendChild(td);

                }
            );


            return row;
        }


        function renderCell(
            vessel,
            field,
            type
        ) {

            const value =
                vessel?.[field];


            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {

                return `
                    <span class="muted-text">—</span>
                `;

            }


            if (type === "vessel") {

                return `
                    <div class="vessel-main">

                        <span class="vessel-name">
                            ${escapeHtml(vessel?.vesselName || "—")}
                        </span>

                        ${
                            vessel?.vesselCode
                                ? `
                                    <span class="vessel-code">
                                        ${escapeHtml(vessel.vesselCode)}
                                    </span>
                                  `
                                : ""
                        }

                    </div>
                `;
            }


            if (type === "voyage") {

                return `
                    <span class="voyage-text">
                        ${escapeHtml(value)}
                    </span>
                `;
            }


            if (type === "type") {

                return `
                    <span class="type-badge">
                        <span class="type-dot"></span>
                        ${escapeHtml(value)}
                    </span>
                `;
            }


            if (type === "datetime") {

                return `
                    <span class="datetime-text">
                        ${escapeHtml(
                            formatDateTime(value)
                        )}
                    </span>
                `;
            }


            if (type === "number") {

                return `
                    <span class="number-text">
                        ${formatNumber(value)}
                    </span>
                `;
            }


            return escapeHtml(value);
        }

        function updateFreshness() {

            if (!CURRENT_DATA) {
                return;
            }

            const timestamp =
                CURRENT_DATA.updatedAt ||
                CURRENT_DATA.lastUpdated;

            if (!timestamp) {
                return;
            }

            const date =
                new Date(timestamp);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return;
            }

            const now =
                new Date();

            const diffMs =
                now.getTime() -
                date.getTime();

            const diffMin =
                Math.floor(
                    diffMs / 60000
                );


            let text;

            if (diffMin < 1) {
                text = "Updated just now";
            }
            else if (diffMin === 1) {
                text = "Updated 1 minute ago";
            }
            else if (diffMin < 60) {
                text =
                    `Updated ${diffMin} minutes ago`;
            }
            else {

                const diffHour =
                    Math.floor(
                        diffMin / 60
                    );

                text =
                    `Updated ${diffHour} hour${diffHour === 1 ? "" : "s"} ago`;
            }


            document
                .getElementById(
                    "freshnessText"
                )
                .textContent = text;
        }

        /* =========================================================
           NEXT SCRAPER UPDATE
           
           Workflow berjalan setiap 30 menit.
           ========================================================= */

        function getNextScraperUpdate() {

            if (!CURRENT_DATA) {
                return null;
            }

            const timestamp =
                CURRENT_DATA.updatedAt ||
                CURRENT_DATA.lastUpdated;

            if (!timestamp) {
                return null;
            }

            const date =
                new Date(timestamp);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return null;
            }

            const interval =
                30 * 60 * 1000;

            const next =
                new Date(
                    Math.ceil(
                        date.getTime() /
                        interval
                    ) * interval
                );

            return next;
        }


        function updateNextUpdate() {

            const element =
                document.getElementById(
                    "nextUpdateText"
                );

            const next =
                getNextScraperUpdate();

            if (!next) {

                element.textContent =
                    "—";

                return;
            }


            const diff =
                next.getTime() -
                Date.now();


            if (diff <= 0) {

                element.textContent =
                    "Soon";

                return;
            }


            const totalSeconds =
                Math.floor(
                    diff / 1000
                );

            const minutes =
                Math.floor(
                    totalSeconds / 60
                );

            const seconds =
                totalSeconds % 60;


            element.textContent =
                `${minutes}m ${String(seconds).padStart(2, "0")}s`;
        }

           LOAD DATA
           ========================================================= */

        async function loadData() {

            updateConnectionStatus(
                "loading"
            );


            try {

                const response =
                    await fetch(
                        `${DATA_URL}?t=${Date.now()}`,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                const data =
                    await response.json();


                CURRENT_DATA =
                    data;


                updateStatistics();
                renderAllSections();
                updateLastUpdate();
                updateSource();
                updateFreshness();
                updateNextUpdate();


                updateConnectionStatus(
                    "online"
                );


                /*
                 * Kalau sedang mencari,
                 * search tetap dipertahankan.
                 */

                if (CURRENT_SEARCH) {

                    document
                        .getElementById(
                            "searchStatus"
                        )
                        .textContent =
                        "Data diperbarui.";

                }

            }
            catch (error) {

                console.error(
                    "Failed to load data:",
                    error
                );


                updateConnectionStatus(
                    "offline"
                );


                renderDataError(
                    error
                );

            }
        }


        function renderDataError(
            error
        ) {

            const container =
                document.getElementById(
                    "dashboardSections"
                );

            container.innerHTML = `
                <div class="section-card p-10 text-center">

                    <div class="w-12 h-12 mx-auto rounded-2xl bg-red-50 text-red-500 flex items-center justify-center">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>

                    <h2 class="mt-4 text-sm font-bold text-slate-800">
                        Failed to load vessel data
                    </h2>

                    <p class="mt-1 text-xs text-slate-400">
                        ${escapeHtml(
                            error?.message ||
                            "Unknown error"
                        )}
                    </p>

                    <button
                        type="button"
                        onclick="loadData()"
                        class="mt-5 px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 transition"
                    >
                        Try Again
                    </button>

                </div>
            `;
        }


        /* =========================================================
           OPTIONAL SCRAPER STATUS
           ========================================================= */

        async function loadScraperStatus() {

            /*
             * Tidak wajib.
             * data.json tetap menjadi sumber utama.
             */

            try {

                const response =
                    await fetch(
                        `${DATA_URL}?t=${Date.now()}`,
                        {
                            cache: "no-store"
                        }
                    );

                if (!response.ok) {
                    return;
                }

            }
            catch (error) {

                console.debug(
                    "Status refresh:",
                    error
                );

            }
        }


        /* =========================================================
           SEARCH EVENTS
           ========================================================= */

        const searchInput =
            document.getElementById(
                "searchInput"
            );


        searchInput.addEventListener(
            "input",
            event => {

                const value =
                    event.target.value;

                CURRENT_SEARCH =
                    value.trim();


                const clearButton =
                    document.getElementById(
                        "clearSearchButton"
                    );


                if (value.trim()) {

                    clearButton.classList.remove(
                        "hidden"
                    );

                }
                else {

                    clearButton.classList.add(
                        "hidden"
                    );

                }


                /*
                 * Filter data secara langsung
                 * ketika mengetik.
                 */

                renderAllSections();

                renderSuggestions(
                    value
                );

            }
        );


        searchInput.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    event.preventDefault();

                    /*
                     * Jika suggestion aktif,
                     * pilih suggestion tersebut.
                     */

                    if (
                        ACTIVE_SUGGESTION >= 0 &&
                        SEARCH_RESULTS[
                            ACTIVE_SUGGESTION
                        ]
                    ) {

                        selectSuggestion(
                            ACTIVE_SUGGESTION
                        );

                        return;
                    }


                    performSearch();

                    return;
                }


                if (event.key === "Escape") {

                    document
                        .getElementById(
                            "searchSuggestions"
                        )
                        .classList.add(
                            "hidden"
                        );

                    ACTIVE_SUGGESTION = -1;

                    return;
                }


                if (
                    event.key === "ArrowDown"
                ) {

                    if (
                        !SEARCH_RESULTS.length
                    ) {
                        return;
                    }

                    event.preventDefault();

                    ACTIVE_SUGGESTION =
                        Math.min(
                            ACTIVE_SUGGESTION + 1,
                            SEARCH_RESULTS.length - 1
                        );

                    updateActiveSuggestion();

                }


                if (
                    event.key === "ArrowUp"
                ) {

                    if (
                        !SEARCH_RESULTS.length
                    ) {
                        return;
                    }

                    event.preventDefault();

                    ACTIVE_SUGGESTION =
                        Math.max(
                            ACTIVE_SUGGESTION - 1,
                            0
                        );

                    updateActiveSuggestion();

                }

            }
        );


        function updateActiveSuggestion() {

            const items =
                document.querySelectorAll(
                    ".suggestion-item"
                );


            items.forEach(
                (item, index) => {

                    item.classList.toggle(
                        "active",
                        index ===
                        ACTIVE_SUGGESTION
                    );

                }
            );


            const active =
                items[
                    ACTIVE_SUGGESTION
                ];


            if (active) {

                active.scrollIntoView({
                    block: "nearest"
                });

            }
        }


        document.addEventListener(
            "click",
            event => {

                const wrapper =
                    document.querySelector(
                        ".search-wrapper"
                    );

                if (
                    wrapper &&
                    !wrapper.contains(
                        event.target
                    )
                ) {

                    document
                        .getElementById(
                            "searchSuggestions"
                        )
                        .classList.add(
                            "hidden"
                        );

                }

            }
        );


        /* =========================================================
           MODAL EVENTS
           ========================================================= */

        document
            .getElementById("vesselModal")
            .addEventListener(
                "click",
                event => {

                    if (
                        event.target.id ===
                        "vesselModal"
                    ) {
                        closeModal();
                    }

                }
            );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    const modal =
                        document.getElementById(
                            "vesselModal"
                        );

                    if (
                        !modal.classList.contains(
                            "hidden"
                        )
                    ) {
                        closeModal();
                    }

                }

            }
        );


        /* =========================================================
           AUTO REFRESH
           ========================================================= */

        setInterval(
            loadData,
            5 * 60 * 1000
        );


        setInterval(
            updateFreshness,
            30 * 1000
        );


        setInterval(
            updateNextUpdate,
            1000
        );


        setInterval(
            loadScraperStatus,
            2 * 60 * 1000
        );


        /* =========================================================
           INITIAL LOAD
           ========================================================= */

        loadData();
        loadScraperStatus();
        updateNextUpdate();

    </script>

</body>
</html>
