<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPKS Vessel Monitoring</title>
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { background: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
        .status-dot { width: 8px; height: 8px; border-radius: 9999px; display: inline-block; background-color: #10b981; }
        .pulse-dot { animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .search-suggestions { position: absolute; top: 100%; left: 0; right: 0; z-index: 50; background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); max-height: 280px; overflow-y: auto; }
        .modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .modal-panel { background: white; border-radius: 1rem; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-header { padding: 1.25rem; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 10; }
        .modal-title { font-size: 1.125rem; font-weight: 700; color: #0f172a; }
        .modal-subtitle { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }
        .modal-close { width: 2rem; height: 2rem; border-radius: 0.5rem; background: #f8fafc; color: #64748b; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: #f1f5f9; color: #0f172a; }
        .modal-body { padding: 1.25rem; }
        .sticky-header { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); }
        .table-sticky-thead th { position: sticky; top: 56px; z-index: 15; background: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- HEADER UTAMA -->
    <header class="bg-white border-b border-slate-200 py-4 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-900 to-sky-600 text-white flex items-center justify-center text-lg font-bold shadow-md shadow-sky-500/20">
                    <i class="fa-solid fa-ship"></i>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-3">
                        <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">
                            TPKS Vessel Monitoring
                        </h1>
                        <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full bg-emerald-50 border border-emerald-100 text-emerald-700 text-[10px] font-bold">
                            <span id="liveDot" class="status-dot pulse-dot"></span>
                            Live
                        </span>
                    </div>
                    <p class="mt-1 text-xs text-slate-500">
                        Pelindo Terminal Petikemas Semarang
                    </p>
                </div>
            </div>
            <div class="hidden sm:flex items-center gap-2">
                <span id="connectionText" class="text-[10px] text-slate-400 font-semibold px-3 py-1 bg-slate-100 rounded-full border border-slate-200">
                    Connecting...
                </span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- SEARCH SECTION -->
        <section class="search-section mb-5">
            <div class="search-wrapper">
                <div class="flex flex-col sm:flex-row gap-2">
                    <div class="relative flex-1">
                        <button id="searchButtonIcon" type="button" onclick="performSearch()" class="absolute left-3 top-1/2 -translate-y-1/2 z-10 text-slate-400 hover:text-slate-700 transition" aria-label="Search">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </button>
                        <input id="searchInput" type="text" autocomplete="off" placeholder="Search vessel, voyage, code, type..." class="search-input w-full h-11 pl-10 pr-10 rounded-xl border border-slate-200 bg-white/90 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
                        <button id="clearSearchButton" type="button" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition" aria-label="Clear search">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                        <div id="searchSuggestions" class="search-suggestions hidden"></div>
                    </div>
                    <button type="button" onclick="performSearch()" class="h-11 px-5 rounded-xl bg-blue-900 hover:bg-blue-800 text-white text-xs font-bold transition flex items-center justify-center gap-2 shadow-sm">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Search
                    </button>
                    <button type="button" onclick="loadData()" class="h-11 px-5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i>
                        Refresh
                    </button>
                </div>
            </div>
            <div class="mt-2 flex items-center justify-between gap-3">
                <p id="searchStatus" class="text-[10px] text-slate-400"></p>
                <p id="freshnessText" class="text-[10px] text-slate-400 text-right">—</p>
            </div>
        </section>

        <!-- STATISTICS / KPI -->
        <section id="statistics" class="statistics-wrapper mb-7">
            <div id="statisticsGrid" class="grid grid-cols-2 lg:grid-cols-5 gap-3"></div>
        </section>

        <!-- DATA SECTIONS -->
        <div id="dashboardSections" class="space-y-5"></div>

        <!-- FOOTER STATUS -->
        <div class="mt-8 pt-4 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-2 text-[10px] text-slate-400">
            <div>
                Source:
                <a id="sourceLink" href="https://ibstpks.pelindo.co.id/webaccess/" target="_blank" rel="noopener noreferrer" class="hover:text-slate-600 underline underline-offset-2 font-medium">
                    Pelindo TPKS Webaccess
                </a>
            </div>
            <div class="flex items-center gap-2">
                <span>Last update:</span>
                <span id="lastUpdateText">—</span>
            </div>
            <div>
                Next scraper:
                <span id="nextUpdateText">—</span>
            </div>
        </div>
    </main>

    <!-- MODAL DETAIL VESSEL -->
    <div id="modalPanel" class="modal-backdrop hidden" onclick="handleBackdropClick(event)" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-panel">
            <div class="modal-header">
                <div class="min-w-0">
                    <h2 id="modalTitle" class="modal-title">Vessel Detail</h2>
                    <div id="modalSubtitle" class="modal-subtitle"></div>
                </div>
                <button type="button" onclick="closeModal()" class="modal-close" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        const DATA_URL = "./data.json";
        const SECTION_CONFIG = [
            {
                key: "vesselAlongside",
                title: "Vessel Alongside",
                icon: "fa-ship",
                color: "border-blue-500 text-blue-600 bg-blue-50",
                columns: [
                    ["vesselName", "Vessel Name"],
                    ["voyage", "Voyage"],
                    ["type", "Type"],
                    ["atb", "ATB"],
                    ["etd", "ETD"]
                ]
            },
            {
                key: "confirmedVessel",
                title: "Confirmed Vessel",
                icon: "fa-circle-check",
                color: "border-emerald-500 text-emerald-600 bg-emerald-50",
                columns: [
                    ["vesselName", "Vessel Name"],
                    ["voyage", "Voyage"],
                    ["type", "Type"],
                    ["etb", "ETB"],
                    ["etd", "ETD"],
                    ["openStack", "Open Stack"],
                    ["closingTime", "Closing Time"],
                    ["booking", "Booking"],
                    ["open", "Open"],
                    ["actual", "Actual"]
                ]
            },
            {
                key: "openStack",
                title: "Open Stack",
                icon: "fa-box-open",
                color: "border-amber-500 text-amber-600 bg-amber-50",
                columns: [
                    ["vesselName", "Vessel Name"],
                    ["voyage", "Voyage"],
                    ["type", "Type"],
                    ["eta", "ETA"],
                    ["etb", "ETB"],
                    ["etd", "ETD"],
                    ["openStack", "Open Stack"],
                    ["closingTime", "Closing Time"],
                    ["booking", "Booking"],
                    ["open", "Open"],
                    ["actual", "Actual"]
                ]
            },
            {
                key: "vesselSchedule",
                title: "Vessel Schedule",
                icon: "fa-calendar-days",
                color: "border-sky-500 text-sky-600 bg-sky-50",
                columns: [
                    ["vesselName", "Vessel Name"],
                    ["voyage", "Voyage"],
                    ["type", "Type"],
                    ["eta", "ETA"],
                    ["etb", "ETB"],
                    ["etd", "ETD"]
                ]
            },
            {
                key: "vesselHistory",
                title: "Vessel History",
                icon: "fa-clock-rotate-left",
                color: "border-slate-500 text-slate-600 bg-slate-50",
                columns: [
                    ["vesselName", "Vessel Name"],
                    ["voyage", "Voyage"],
                    ["type", "Type"],
                    ["atb", "ATB"],
                    ["atd", "ATD"],
                    ["export", "Export (Box/TEUs)"],
                    ["import", "Import (Box/TEUs)"]
                ]
            }
        ];

        let state = { data: null };

        async function loadData() {
            const conn = document.getElementById("connectionText");
            if (conn) conn.innerText = "Refreshing...";
            try {
                const res = await fetch(`${DATA_URL}?t=${Date.now()}`);
                if (!res.ok) throw new Error("HTTP error");
                state.data = await res.json();
                renderKPI();
                renderSections();
                updateFooter();
                if (conn) conn.innerText = "Connected";
            } catch (e) {
                if (conn) conn.innerText = "Offline / Error";
            }
        }

        function renderKPI() {
            const grid = document.getElementById("statisticsGrid");
            if (!grid || !state.data) return;
            grid.innerHTML = SECTION_CONFIG.map(sec => {
                const list = state.data[sec.key] || [];
                return `
                    <div onclick="scrollToSection('${sec.key}')" class="cursor-pointer bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition border-l-4 ${sec.color.split(' ')}">
                        <div class="flex items-center justify-between text-xs text-slate-400 font-semibold mb-1">
                            <span>${sec.title}</span>
                            <i class="fa-solid ${sec.icon}"></i>
                        </div>
                        <div class="text-xl font-extrabold text-slate-900">${list.length}</div>
                    </div>
                `;
            }).join("");
        }

        function renderSections() {
            const container = document.getElementById("dashboardSections");
            if (!container || !state.data) return;
            container.innerHTML = SECTION_CONFIG.map(sec => {
                const list = state.data[sec.key] || [];
                return `
                    <section id="sec-${sec.key}" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="sticky-header px-5 py-3.5 border-b border-slate-200 flex items-center justify-between">
                            <div class="flex items-center gap-2.5">
                                <span class="w-8 h-8 rounded-lg ${sec.color} flex items-center justify-center text-sm font-bold">
                                    <i class="fa-solid ${sec.icon}"></i>
                                </span>
                                <h2 class="font-bold text-slate-900 text-sm">${sec.title}</h2>
                            </div>
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600">${list.length} items</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead class="table-sticky-thead uppercase text-[10px] tracking-wider text-slate-400">
                                    <tr>
                                        ${sec.columns.map(col => `<th class="px-4 py-3 font-bold border-b border-slate-200">\${col[1]}</th>`).join("")}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-slate-700">
                                    ${list.length === 0 ? `<tr><td colspan="\${sec.columns.length}" class="py-6 text-center text-slate-400 italic">No vessel data available</td></tr>` :
                                        list.map(v => `
                                            <tr onclick='openModal(\\({JSON.stringify(v).replace(/'/g, "&apos;")}, "\\){sec.title}")' class="hover:bg-sky-50/50 cursor-pointer transition">
                                                \${sec.columns.map(col => `<td class="px-4 py-3 whitespace-nowrap font-medium">${formatCell(v, col)}</td>`).join("")}
                                            </tr>
                                        `).join("")
                                    }
                                </tbody>
                            </table>
                        </div>
                    </section>
                `;
            }).join("");
        }

        function formatCell(vessel, key) {
            if (key === "booking" || key === "open" || key === "actual") return vessel[key] || "-";
            if (key === "export") return vessel.export ? `${vessel.export} box / ${vessel.exportTeus || '-'} TEUs` : "-";
            if (key === "import") return vessel.import ? `${vessel.import} box / ${vessel.importTeus || '-'} TEUs` : "-";
            if (key === "vesselName") return `<span class="font-bold text-slate-900">${vessel.vesselName || '-'}</span> ${vessel.vesselCode ? `<span class="text-[10px] text-slate-400">(\${vessel.vesselCode})</span>` : ''}`;
            if (key === "type") return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${vessel.type === 'INTERNATIONAL' ? 'bg-indigo-50 text-indigo-600 border border-indigo-100' : 'bg-amber-50 text-amber-600 border border-amber-100'}">${vessel.type || '-'}</span>`;
            return vessel[key] || "-";
        }

        function openModal(vessel, sectionName) {
            const modal = document.getElementById("modalPanel");
            document.getElementById("modalTitle").innerText = vessel.vesselName || "Vessel Detail";
            document.getElementById("modalSubtitle").innerText = `${sectionName} • Voyage: ${vessel.voyage || '-'} ${vessel.vesselCode ? `(\${vessel.vesselCode})` : ''}`;
            
            const body = document.getElementById("modalBody");
            body.innerHTML = `
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 text-[10px] block">Shipping Line</span><span class="font-bold text-slate-800">${vessel.shippingLine || '-'}</span></div>
                    <div class="p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 text-[10px] block">Pelayaran</span><span class="font-bold text-slate-800">${vessel.type || '-'}</span></div>
                    <div class="p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 text-[10px] block">ETA</span><span class="font-bold text-slate-800">${vessel.eta || '-'}</span></div>
                    <div class="p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 text-[10px] block">ETB</span><span class="font-bold text-slate-800">${vessel.etb || '-'}</span></div>
                    <div class="p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 text-[10px] block">ATB</span><span class="font-bold text-slate-800">${vessel.atb || '-'}</span></div>
                    <div class="p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 text-[10px] block">ETD</span><span class="font-bold text-slate-800">${vessel.etd || '-'}</span></div>
                    <div class="p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 text-[10px] block">ATD</span><span class="font-bold text-slate-800">${vessel.atd || '-'}</span></div>
                    <div class="p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 text-[10px] block">Open Stack</span><span class="font-bold text-slate-800">${vessel.openStack || '-'}</span></div>
                    <div class="p-2.5 bg-slate-50 rounded-lg"><span class="text-slate-400 text-[10px] block">Closing Time</span><span class="font-bold text-slate-800">${vessel.closingTime || '-'}</span></div>
                    <div class="p-2.5 bg-blue-50/50 border border-blue-100 rounded-lg"><span class="text-blue-500 text-[10px] block">Booking / Open / Actual</span><span class="font-bold text-blue-900">${vessel.booking || '-'} / ${vessel.open || '-'} / ${vessel.actual || '-'}</span></div>
                </div>
            `;
            modal.classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("modalPanel").classList.add("hidden");
        }

        function handleBackdropClick(e) {
            if (e.target.id === "modalPanel") closeModal();
        }

        function scrollToSection(key) {
            const el = document.getElementById(`sec-${key}`);
            if (el) el.scrollIntoView({ behavior: "smooth" });
        }

        function updateFooter() {
            if (!state.data) return;
            const last = document.getElementById("lastUpdateText");
            const fresh = document.getElementById("freshnessText");
            if (last) last.innerText = state.data.updatedAt || state.data.lastUpdated || "-";
            if (fresh) fresh.innerText = `Updated: ${state.data.updatedAt || state.data.lastUpdated || '-'}`;
        }

        function performSearch() {
            const q = document.getElementById("searchInput").value.toLowerCase().trim();
            if (!q || !state.data) return;
            const clearBtn = document.getElementById("clearSearchButton");
            if (clearBtn) clearBtn.classList.remove("hidden");

            SECTION_CONFIG.forEach(sec => {
                const el = document.getElementById(`sec-${sec.key}`);
                if (!el) return;
                const rows = el.querySelectorAll("tbody tr");
                rows.forEach(tr => {
                    const txt = tr.innerText.toLowerCase();
                    tr.style.display = txt.includes(q) ? "" : "none";
                });
            });
        }

        function clearSearch() {
            document.getElementById("searchInput").value = "";
            document.getElementById("clearSearchButton").classList.add("hidden");
            SECTION_CONFIG.forEach(sec => {
                const el = document.getElementById(`sec-${sec.key}`);
                if (!el) return;
                const rows = el.querySelectorAll("tbody tr");
                rows.forEach(tr => tr.style.display = "");
            });
        }

        window.addEventListener("DOMContentLoaded", loadData);
    </script>
</body>
</html>
