<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPKS Vessel Monitoring Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 45%,#f8fafc 100%);color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.main-header{position:relative;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #e2e8f0}
.brand-mark{width:40px;height:40px;background:linear-gradient(135deg,#1e3a8a 0%,#0284c7 100%);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(2,132,199,.25)}
.status-dot{width:8px;height:8px;border-radius:9999px;display:inline-block}
.pulse-dot{animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.search-section{position:relative;z-index:40}
.search-wrapper{position:relative;z-index:50}
.search-input{width:100%;height:46px;padding-left:42px;padding-right:40px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;font-size:13px;color:#0f172a;transition:all .2s ease}
.search-input:focus{outline:none;border-color:#0284c7;box-shadow:0 0 0 3px rgba(2,132,199,.18)}
.search-suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:100;background:rgba(255,255,255,.98);border:1px solid #cbd5e1;border-radius:14px;box-shadow:0 20px 40px rgba(15,23,42,.12);backdrop-filter:blur(14px);max-height:320px;overflow-y:auto}
.suggestion-item{width:100%;padding:10px 14px;border:none;background:transparent;text-align:left;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background .15s ease}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item:hover,.suggestion-item.active{background:#f0f9ff}
.search-button{height:46px;padding:0 22px;border-radius:12px;background:linear-gradient(135deg,#1e3a8a 0%,#0284c7 100%);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s ease}
.search-button:hover{opacity:.92}
.refresh-button{height:46px;padding:0 18px;border-radius:12px;background:#fff;border:1px solid #cbd5e1;color:#334155;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s ease}
.refresh-button:hover{background:#f8fafc;border-color:#94a3b8}
.stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;position:relative;overflow:hidden;cursor:pointer;transition:all .2s ease}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3.5px;background:linear-gradient(90deg,var(--accent-a,#0284c7),var(--accent-b,#06b6d4))}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(15,23,42,.08);border-color:#cbd5e1;background:var(--accent-bg,#f0f9ff)}
.stat-icon{width:32px;height:32px;border-radius:8px;background:var(--accent-bg,#f0f9ff);color:var(--accent-a,#0284c7);display:flex;align-items:center;justify-content:center}
.stat-number{font-size:22px;font-weight:800;color:#0f172a;line-height:1}
.dashboard-section{position:relative;scroll-margin-top:12px;overflow:visible}
.section-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 2px 8px rgba(15,23,42,.035);overflow:visible}
.section-header{position:sticky;top:0;z-index:30;min-height:60px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;border-top-left-radius:16px;border-top-right-radius:16px}
.section-title-icon{width:32px;height:32px;border-radius:8px;background:#f1f5f9;color:#0284c7;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.section-count{padding:4px 10px;border-radius:9999px;background:#f8fafc;border:1px solid #e2e8f0;font-size:11px;font-weight:700;color:#475569}
.section-scroll{width:100%;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:12px}
.section-scroll thead{position:sticky;top:60px;z-index:20}
.section-scroll thead th{padding:10px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;color:#64748b;font-size:10px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;text-align:left}
.section-scroll tbody td{padding:11px 14px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle;white-space:nowrap}
.section-scroll tbody tr{background:#fff;cursor:pointer;transition:background .15s ease}
.section-scroll tbody tr:nth-child(even){background:#fcfdff}
.section-scroll tbody tr:hover{background:#f0f9ff}
.section-scroll tbody tr:last-child td{border-bottom:0}
.vessel-primary{font-weight:700;color:#0f172a}
.vessel-secondary{font-size:10px;color:#64748b}
.voyage-badge{display:inline-block;padding:2px 8px;border-radius:6px;background:#eff6ff;color:#1d4ed8;font-weight:700;font-size:11px}
.type-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:700;border:1px solid #e2e8f0}
.datetime-value{color:#334155;font-weight:600;font-variant-numeric:tabular-nums}
.search-hit td{animation:searchHit 3s ease both}
.search-hit td:first-child{box-shadow:inset 4px 0 0 #0284c7!important}
@keyframes searchHit{0%{background:#bae6fd!important}20%{background:#e0f2fe!important}60%{background:#f0f9ff!important}100%{background:inherit}}
.modal-backdrop{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-card{width:min(680px,100%);max-height:88vh;overflow-y:auto;background:#fff;border-radius:20px;box-shadow:0 25px 60px rgba(15,23,42,.25);border:1px solid #e2e8f0}
.modal-header{position:sticky;top:0;z-index:10;padding:18px 20px;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border-bottom:1px solid #e2e8f0}
.modal-section-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9999px;background:#e0f2fe;color:#0369a1;font-size:11px;font-weight:750;margin-bottom:6px}
.modal-vessel-name{font-size:20px;font-weight:800;color:#0f172a;line-height:1.2}
.modal-voyage{font-size:12px;color:#64748b;margin-top:4px}
.modal-body{padding:20px}
.modal-field{padding:10px 12px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:10px}
.modal-field-label{font-size:9px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:2px}
.modal-field-value{font-size:13px;font-weight:650;color:#1e293b;word-break:break-word}
.empty-state{padding:40px 20px;text-align:center}
.empty-icon{width:40px;height:40px;border-radius:12px;background:#f1f5f9;color:#94a3b8;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:18px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
</style>
</head>
<body>

<header class="main-header py-4">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
<div class="flex items-center gap-3 min-w-0">
<div class="brand-mark"><i class="fa-solid fa-ship"></i></div>
<div class="min-w-0">
<div class="flex items-center gap-2 flex-wrap">
<h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900">TPKS Vessel Monitoring</h1>
<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[10px] font-bold"><span id="liveDot" class="status-dot bg-emerald-500 pulse-dot"></span>Live</span>
</div>
<p class="text-xs text-slate-500 mt-0.5">Pelindo Terminal Petikemas Semarang</p>
</div>
</div>
<div class="hidden sm:flex items-center gap-2">
<span id="connectionPill" class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-100 border border-slate-200 text-slate-600 text-xs font-semibold"><span id="connectionDot" class="status-dot bg-sky-500"></span><span id="connectionText">Connecting...</span></span>
</div>
</div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
<section class="search-section mb-6">
<div class="search-wrapper">
<div class="flex flex-col sm:flex-row gap-2">
<div class="relative flex-1">
<i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none"></i>
<input id="searchInput" class="search-input" type="text" autocomplete="off" placeholder="Cari kapal, voyage, kode, tipe, atau seksi..." aria-label="Search vessel">
<button id="clearSearchButton" type="button" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1" aria-label="Clear search"><i class="fa-solid fa-xmark text-sm"></i></button>
<div id="searchSuggestions" class="search-suggestions hidden"></div>
</div>
<button id="searchButton" type="button" class="search-button" onclick="performSearch()"><i class="fa-solid fa-magnifying-glass"></i><span>Cari</span></button>
<button id="refreshButton" type="button" class="refresh-button" onclick="loadData()"><i class="fa-solid fa-rotate-right"></i><span>Refresh</span></button>
</div>
</div>
<div class="mt-2 flex items-center justify-between gap-3 text-[11px] text-slate-400"><p id="searchStatus"></p><p id="freshnessText" class="text-right">—</p></div>
</section>

<section class="mb-6"><div id="statistics" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3"></div></section>
<div id="dashboardSections" class="space-y-6"></div>

<footer class="pt-8 pb-4 text-[11px] text-slate-400 border-t border-slate-200 mt-10">
<div class="flex flex-col sm:flex-row items-center justify-between gap-2">
<div>TPKS Vessel Monitoring Portal &copy; 2026</div>
<div>Sumber Data: <a id="sourceLink" href="https://ibstpks.pelindo.co.id/webaccess/" target="_blank" rel="noopener noreferrer" class="underline hover:text-slate-600">Pelindo TPKS Webaccess</a></div>
</div>
</footer>
</main>

<div id="vesselModal" class="modal-backdrop hidden" onclick="handleModalBackdropClick(event)">
<div class="modal-card">
<div class="modal-header">
<div class="flex items-start justify-between gap-4">
<div class="min-w-0">
<div id="modalSectionBadge" class="modal-section-badge"><i class="fa-solid fa-ship"></i><span>Vessel</span></div>
<div id="modalVesselName" class="modal-vessel-name">—</div>
<div id="modalVoyage" class="modal-voyage">—</div>
</div>
<button type="button" onclick="closeVesselModal()" class="w-8 h-8 rounded-xl flex items-center justify-center bg-slate-100 text-slate-500 hover:text-slate-900 hover:bg-slate-200 transition" aria-label="Close modal"><i class="fa-solid fa-xmark"></i></button>
</div>
</div>
<div id="modalBody" class="modal-body"></div>
</div>
</div>

<script>
const DATA_URL="./data.json";
const AUTO_REFRESH_INTERVAL=5*60*1000;
const FRESHNESS_INTERVAL=30*1000;

const SECTION_CONFIG=[
{key:"vesselAlongside",title:"Vessel Alongside",icon:"fa-ship",subtitle:"Kapal yang sedang bertambat di dermaga",accentA:"#2563eb",accentB:"#0891b2",accentBg:"#eff6ff",columns:[["vesselName","Vessel Name","vessel"],["voyage","Voyage","voyage"],["type","Tipe","type"],["atb","ATB","datetime"],["etd","ETD","datetime"]]},
{key:"confirmedVessel",title:"Confirmed Vessel",icon:"fa-circle-check",subtitle:"Kapal dengan jadwal bertambat terkonfirmasi",accentA:"#7c3aed",accentB:"#6366f1",accentBg:"#f5f3ff",columns:[["vesselName","Vessel Name","vessel"],["voyage","Voyage","voyage"],["type","Tipe","type"],["eta","ETA","datetime"],["etb","ETB","datetime"],["etd","ETD","datetime"]]},
{key:"openStack",title:"Open Stack",icon:"fa-box-open",subtitle:"Informasi open stack penerimaan kargo ekspor",accentA:"#ea580c",accentB:"#f59e0b",accentBg:"#fff7ed",columns:[["vesselName","Vessel Name","vessel"],["voyage","Voyage","voyage"],["type","Tipe","type"],["openStack","Open Stack","datetime"],["closingTime","Closing Time","datetime"]]},
{key:"vesselSchedule",title:"Vessel Schedule",icon:"fa-calendar-days",subtitle:"Estimasi jadwal kedatangan kapal mendatang",accentA:"#0284c7",accentB:"#06b6d4",accentBg:"#ecfeff",columns:[["vesselName","Vessel Name","vessel"],["voyage","Voyage","voyage"],["type","Tipe","type"],["eta","ETA","datetime"],["etb","ETB","datetime"],["etd","ETD","datetime"]]},
{key:"vesselHistory",title:"Vessel History",icon:"fa-clock-rotate-left",subtitle:"Riwayat pergerakan kapal yang telah berlayar",accentA:"#059669",accentB:"#14b8a6",accentBg:"#ecfdf5",columns:[["vesselName","Vessel Name","vessel"],["voyage","Voyage","voyage"],["type","Tipe","type"],["atb","ATB","datetime"],["atd","ATD","datetime"]]}
];

const MODAL_FIELDS=[
["vesselName","Nama Kapal"],["vesselCode","Kode Kapal"],["voyage","Voyage"],["type","Tipe Pelayaran"],["shippingLine","Agen Pelayaran"],["eta","ETA"],["etb","ETB"],["atb","ATB"],["etd","ETD"],["atd","ATD"],["openStack","Open Stack"],["closingTime","Closing Time"],["booking","Booking Box"],["open","Open Box"],["actual","Actual Box"],["export","Export Box"],["exportTeus","Export TEUs"],["import","Import Box"],["importTeus","Import TEUs"]
];

let dashboardData={lastUpdated:null,updatedAt:null,source:"",vesselAlongside:[],confirmedVessel:[],openStack:[],vesselSchedule:[],vesselHistory:[],counts:{}};
let searchResults=[];
let activeSuggestionIndex=-1;
let autoRefreshTimer=null;
let nextUpdateAt=null;

const searchInput=document.getElementById("searchInput");
const searchSuggestions=document.getElementById("searchSuggestions");
const clearSearchButton=document.getElementById("clearSearchButton");
const searchStatus=document.getElementById("searchStatus");
const freshnessText=document.getElementById("freshnessText");
const dashboardSections=document.getElementById("dashboardSections");
const statistics=document.getElementById("statistics");

function escapeHtml(val){if(val===null||val===undefined)return "";return String(val).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function normalizeSearchValue(val){if(val===null||val===undefined)return "";return String(val).toLowerCase().trim()}
function getVesselKey(vessel,sectionKey){const name=normalizeSearchValue(vessel?.vesselName),code=normalizeSearchValue(vessel?.vesselCode),voyage=normalizeSearchValue(vessel?.voyage);return[sectionKey,name,code,voyage].join("|")}
function getAllRecords(){const results=[];SECTION_CONFIG.forEach(section=>{const rows=Array.isArray(dashboardData[section.key])?dashboardData[section.key]:[];rows.forEach(vessel=>results.push({vessel,section,key:getVesselKey(vessel,section.key)}))});return results}
function formatDateTime(val){if(!val)return"—";return String(val)}

function setConnectionStatus(status){
const dot=document.getElementById("connectionDot"),text=document.getElementById("connectionText"),pill=document.getElementById("connectionPill"),liveDot=document.getElementById("liveDot");
if(status==="online"){dot.className="status-dot bg-emerald-500";text.textContent="Online";pill.className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold";liveDot.classList.remove("bg-slate-400");liveDot.classList.add("bg-emerald-500")}
else if(status==="loading"){dot.className="status-dot bg-amber-500 pulse-dot";text.textContent="Updating...";pill.className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-700 text-xs font-semibold"}
else{dot.className="status-dot bg-red-500";text.textContent="Offline";pill.className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-50 border border-red-200 text-red-700 text-xs font-semibold";liveDot.classList.remove("bg-emerald-500");liveDot.classList.add("bg-red-500")}
}

function updateStatistics(){
const stats=[
{key:"vesselAlongside",label:"Alongside",icon:"fa-ship",a:"#2563eb",b:"#0891b2",bg:"#eff6ff"},
{key:"confirmedVessel",label:"Confirmed",icon:"fa-circle-check",a:"#7c3aed",b:"#6366f1",bg:"#f5f3ff"},
{key:"openStack",label:"Open Stack",icon:"fa-box-open",a:"#ea580c",b:"#f59e0b",bg:"#fff7ed"},
{key:"vesselSchedule",label:"Schedule",icon:"fa-calendar-days",a:"#0284c7",b:"#06b6d4",bg:"#ecfeff"},
{key:"vesselHistory",label:"History",icon:"fa-clock-rotate-left",a:"#059669",b:"#14b8a6",bg:"#ecfdf5"}
];
statistics.innerHTML=stats.map(s=>{const count=Array.isArray(dashboardData[s.key])?dashboardData[s.key].length:0;return`<button type="button" class="stat-card text-left" style="--accent-a:${s.a};--accent-b:${s.b};--accent-bg:${s.bg}" onclick="scrollToSection('${s.key}')"><div class="flex items-center justify-between gap-2"><div class="stat-icon"><i class="fa-solid ${s.icon}"></i></div><span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${s.label}</span></div><div class="mt-3 stat-number">${count}</div><div class="mt-1 text-[10px] text-slate-400">data tersedia</div></button>`}).join("")
}

function scrollToSection(key){const el=document.getElementById(`section-${key}`);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}

function renderAllSections(){
dashboardSections.innerHTML="";
SECTION_CONFIG.forEach(section=>renderSection(section));
}

function renderSection(section){
const rows=Array.isArray(dashboardData[section.key])?dashboardData[section.key]:[];
const sectionElem=document.createElement("section");
sectionElem.id=`section-${section.key}`;
sectionElem.className="dashboard-section section-card";
sectionElem.style.setProperty("--accent-a",section.accentA);
sectionElem.style.setProperty("--accent-b",section.accentB);
sectionElem.style.setProperty("--accent-bg",section.accentBg);

const header=document.createElement("div");
header.className="section-header";
header.innerHTML=`<div class="flex items-center gap-3 min-w-0"><div class="section-title-icon"><i class="fa-solid ${section.icon}"></i></div><div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><h2 class="text-sm font-extrabold text-slate-900">${escapeHtml(section.title)}</h2><span class="section-count">${rows.length}</span></div><p class="text-[10px] text-slate-400 mt-0.5">${escapeHtml(section.subtitle)}</p></div></div><div class="hidden sm:flex items-center gap-2 text-[10px] text-slate-400"><i class="fa-solid fa-arrow-down-wide-short"></i><span>Scroll tabel</span></div>`;

const scroll=document.createElement("div");
scroll.className="section-scroll";

if(!rows.length){
scroll.innerHTML=`<div class="empty-state"><div class="empty-icon"><i class="fa-solid ${section.icon}"></i></div><div class="text-xs font-semibold text-slate-500">Tidak ada data</div><div class="text-[10px] text-slate-400 mt-1">Belum ada informasi pada seksi ini.</div></div>`;
sectionElem.appendChild(header);
sectionElem.appendChild(scroll);
dashboardSections.appendChild(sectionElem);
return;
}

const table=document.createElement("table");
const thead=document.createElement("thead");
thead.innerHTML=`<tr>${section.columns.map(([_,label])=>`<th>${escapeHtml(label)}</th>`).join("")}</tr>`;
const tbody=document.createElement("tbody");
rows.forEach(vessel=>tbody.appendChild(renderTableRow(vessel,section)));
table.appendChild(thead);
table.appendChild(tbody);
scroll.appendChild(table);
sectionElem.appendChild(header);
sectionElem.appendChild(scroll);
dashboardSections.appendChild(sectionElem);
}

function renderTableRow(vessel,section){
const row=document.createElement("tr");
row.dataset.vesselKey=getVesselKey(vessel,section.key);
row.onclick=()=>openVesselModal(vessel,section);
section.columns.forEach(([key,_,type])=>{const td=document.createElement("td");td.innerHTML=renderCellValue(vessel,key,type);row.appendChild(td)});
return row;
}

function renderCellValue(vessel,key,type){
const val=vessel?.[key];
if(!val&&val!==0)return`<span class="text-slate-300">—</span>`;
if(type==="vessel")return`<div><div class="vessel-primary">${escapeHtml(vessel.vesselName||"—")}</div>${vessel.vesselCode?`<div class="vessel-secondary">${escapeHtml(vessel.vesselCode)}</div>`:""}</div>`;
if(type==="voyage")return`<span class="voyage-badge">${escapeHtml(val)}</span>`;
if(type==="type")return`<span class="type-badge">${escapeHtml(val)}</span>`;
if(type==="datetime")return`<span class="datetime-value">${escapeHtml(formatDateTime(val))}</span>`;
return escapeHtml(val);
}

function findSearchResults(query){
const q=normalizeSearchValue(query);
if(!q)return[];
const records=getAllRecords(),terms=q.split(/\s+/).filter(Boolean),scored=[];
records.forEach(result=>{
const v=result.vessel,s=result.section;
const searchable=[v.vesselName,v.vesselCode,v.voyage,v.type,v.shippingLine,v.eta,v.etb,v.atb,v.etd,v.atd,v.openStack,v.closingTime,s.title].map(normalizeSearchValue).join(" ");
if(terms.every(t=>searchable.includes(t))){let score=0;if(normalizeSearchValue(v.vesselName)===q)score+=1000;if(normalizeSearchValue(v.voyage)===q)score+=800;scored.push({...result,score})}
});
scored.sort((a,b)=>b.score-a.score);
return scored;
}

function updateSearchSuggestions(){
const query=searchInput.value.trim();
clearSearchButton.classList.toggle("hidden",!query);
if(!query){hideSearchSuggestions();searchStatus.textContent="";return}
const results=findSearchResults(query);
searchResults=results.slice(0,10);
activeSuggestionIndex=-1;
if(!searchResults.length){searchSuggestions.innerHTML=`<div class="p-4 text-center text-xs text-slate-400">Tidak ada data kapal yang cocok.</div>`;searchSuggestions.classList.remove("hidden");return}
searchSuggestions.innerHTML=searchResults.map((res,index)=>`<div class="suggestion-item" data-index="${index}" onclick="openSearchSuggestion(${index})"><div class="flex items-center justify-between gap-2"><div><div class="text-xs font-bold text-slate-800">${escapeHtml(res.vessel.vesselName)}</div><div class="text-[10px] text-slate-500">Voyage ${escapeHtml(res.vessel.voyage||"—")} &middot; <span class="font-semibold text-blue-600">${escapeHtml(res.section.title)}</span></div></div><i class="fa-solid fa-chevron-right text-[10px] text-slate-300"></i></div></div>`).join("");
searchSuggestions.classList.remove("hidden");
}

function openSearchSuggestion(index){const res=searchResults[index];if(!res)return;hideSearchSuggestions();openVesselModal(res.vessel,res.section)}

function performSearch(){
const query=searchInput.value.trim();
if(!query)return;
const results=findSearchResults(query);
if(!results.length){searchStatus.textContent=`Data "${query}" tidak ditemukan.`;hideSearchSuggestions();return}
const topResult=results;
hideSearchSuggestions();
jumpToSearchResult(topResult);
searchStatus.textContent=`Ditemukan ${results.length} hasil untuk "${query}".`;
}

function jumpToSearchResult(result){
if(!result)return;
const key=getVesselKey(result.vessel,result.section.key);
const row=document.querySelector(`[data-vessel-key="${CSS.escape(key)}"]`);
if(row){row.scrollIntoView({behavior:"smooth",block:"center"});row.classList.remove("search-hit");void row.offsetWidth;row.classList.add("search-hit");setTimeout(()=>row.classList.remove("search-hit"),3000)}
else scrollToSection(result.section.key);
}

function clearSearch(){searchInput.value="";searchStatus.textContent="";clearSearchButton.classList.add("hidden");hideSearchSuggestions();searchInput.focus()}
function hideSearchSuggestions(){searchSuggestions.classList.add("hidden");activeSuggestionIndex=-1}

function openVesselModal(vessel,section){
const modal=document.getElementById("vesselModal");
document.getElementById("modalSectionBadge").innerHTML=`<i class="fa-solid ${section.icon}"></i> <span>${escapeHtml(section.title)}</span>`;
document.getElementById("modalVesselName").textContent=vessel.vesselName||"—";
document.getElementById("modalVoyage").textContent=`Voyage ${vessel.voyage||"—"} ${vessel.vesselCode?`(${vessel.vesselCode})`:""}`;
const body=document.getElementById("modalBody");
const availableFields=MODAL_FIELDS.filter(([k])=>vessel[k]!==undefined&&vessel[k]!==null&&vessel[k]!=="");
if(!availableFields.length)body.innerHTML=`<div class="p-6 text-center text-xs text-slate-400">Tidak ada detail tambahan.</div>`;
else body.innerHTML=`<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${availableFields.map(([key,label])=>`<div class="modal-field"><div class="modal-field-label">${escapeHtml(label)}</div><div class="modal-field-value">${escapeHtml(vessel[key])}</div></div>`).join("")}</div>`;
modal.classList.remove("hidden");
document.body.classList.add("overflow-hidden");
}

function closeVesselModal(){document.getElementById("vesselModal").classList.add("hidden");document.body.classList.remove("overflow-hidden")}
function handleModalBackdropClick(e){if(e.target.id==="vesselModal")closeVesselModal()}

async function loadData(){
setConnectionStatus("loading");
try{
const res=await fetch(`${DATA_URL}?t=${Date.now()}`,{cache:"no-store"});
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const data=await res.json();
dashboardData={
lastUpdated:data.lastUpdated||data.updatedAt||null,
updatedAt:data.updatedAt||data.lastUpdated||null,
source:data.source||"",
vesselAlongside:Array.isArray(data.vesselAlongside)?data.vesselAlongside:[],
confirmedVessel:Array.isArray(data.confirmedVessel)?data.confirmedVessel:[],
openStack:Array.isArray(data.openStack)?data.openStack:[],
vesselSchedule:Array.isArray(data.vesselSchedule)?data.vesselSchedule:[],
vesselHistory:Array.isArray(data.vesselHistory)?data.vesselHistory:[],
counts:data.counts||{}
};
updateStatistics();
renderAllSections();
updateFreshness();
setConnectionStatus("online");
nextUpdateAt=Date.now()+AUTO_REFRESH_INTERVAL;
}catch(err){console.error("Failed to load data:",err);setConnectionStatus("offline")}
}

function updateFreshness(){
const rawDate=dashboardData.lastUpdated||dashboardData.updatedAt;
if(!rawDate){freshnessText.textContent="Data time unavailable";return}
freshnessText.textContent=`Terakhir diperbarui: ${rawDate}`;
}

searchInput.addEventListener("input",updateSearchSuggestions);
searchInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();performSearch()}if(e.key==="Escape")hideSearchSuggestions()});
document.addEventListener("click",e=>{if(!document.querySelector(".search-wrapper")?.contains(e.target))hideSearchSuggestions()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeVesselModal()});

setInterval(loadData,AUTO_REFRESH_INTERVAL);
setInterval(updateFreshness,FRESHNESS_INTERVAL);
loadData();
</script>
</body>
</html>
