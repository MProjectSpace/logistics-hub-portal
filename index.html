<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TPKS Vessel Monitoring</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{background:#f8fafc;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
.status-dot{width:8px;height:8px;border-radius:9999px;display:inline-block;background:#10b981}
.pulse-dot{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.search-suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:50;background:#fff;border:1px solid #e2e8f0;border-radius:.75rem;box-shadow:0 10px 25px -5px rgba(0,0,0,.1);max-height:280px;overflow-y:auto}
.search-suggestion{padding:.65rem .8rem;cursor:pointer;border-bottom:1px solid #f1f5f9}
.search-suggestion:last-child{border-bottom:0}
.search-suggestion:hover{background:#f8fafc}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-panel{background:#fff;border-radius:1rem;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 25px -5px rgba(0,0,0,.15)}
.modal-header{padding:1.25rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10}
.modal-title{font-size:1.125rem;font-weight:700;color:#0f172a}
.modal-subtitle{font-size:.75rem;color:#64748b;margin-top:.25rem}
.modal-close{width:2rem;height:2rem;border-radius:.5rem;background:#f8fafc;color:#64748b;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#f1f5f9;color:#0f172a}
.modal-body{padding:1.25rem}
.sticky-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px)}
.table-sticky-thead th{position:sticky;top:56px;z-index:15;background:#f8fafc}
.table-row-hidden{display:none!important}
.fade-in{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<body class="text-slate-800 antialiased">

<!-- HEADER -->
<header class="bg-white border-b border-slate-200 py-4 px-4 sm:px-6 lg:px-8">
<div class="max-w-7xl mx-auto flex items-center justify-between gap-4">

<div class="flex items-center gap-3 min-w-0">
<div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-tr from-blue-900 to-sky-600 text-white flex items-center justify-center text-lg font-bold shadow-md shadow-sky-500/20">
<i class="fa-solid fa-ship"></i>
</div>

<div class="min-w-0">
<div class="flex items-center gap-3 flex-wrap">
<h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">
TPKS Vessel Monitoring
</h1>

<span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full bg-emerald-50 border border-emerald-100 text-emerald-700 text-[10px] font-bold">
<span id="liveDot" class="status-dot pulse-dot"></span>
Live
</span>
</div>

<p class="mt-1 text-xs text-slate-500">
Pelindo Terminal Petikemas Semarang
</p>
</div>
</div>

<div class="hidden sm:flex items-center gap-2">
<span id="connectionText" class="text-[10px] text-slate-400 font-semibold px-3 py-1 bg-slate-100 rounded-full border border-slate-200">
Connecting...
</span>
</div>

</div>
</header>

<!-- MAIN -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

<!-- SEARCH -->
<section class="mb-5">
<div class="flex flex-col sm:flex-row gap-2">

<div class="relative flex-1">
<button id="searchButtonIcon" type="button" onclick="performSearch()" class="absolute left-3 top-1/2 -translate-y-1/2 z-10 text-slate-400 hover:text-slate-700 transition" aria-label="Search">
<i class="fa-solid fa-magnifying-glass text-sm"></i>
</button>

<input
id="searchInput"
type="text"
autocomplete="off"
placeholder="Search vessel, voyage, code, type..."
class="w-full h-11 pl-10 pr-10 rounded-xl border border-slate-200 bg-white text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">

<button id="clearSearchButton" type="button" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition" aria-label="Clear search">
<i class="fa-solid fa-xmark text-sm"></i>
</button>

<div id="searchSuggestions" class="search-suggestions hidden"></div>
</div>

<button type="button" onclick="performSearch()" class="h-11 px-5 rounded-xl bg-blue-900 hover:bg-blue-800 text-white text-xs font-bold transition flex items-center justify-center gap-2 shadow-sm">
<i class="fa-solid fa-magnifying-glass"></i>
Search
</button>

<button type="button" onclick="loadData()" class="h-11 px-5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold transition flex items-center justify-center gap-2">
<i id="refreshIcon" class="fa-solid fa-rotate-right"></i>
Refresh
</button>

</div>

<div class="mt-2 flex items-center justify-between gap-3">
<p id="searchStatus" class="text-[10px] text-slate-400"></p>
<p id="freshnessText" class="text-[10px] text-slate-400 text-right">—</p>
</div>
</section>

<!-- KPI -->
<section class="mb-7">
<div id="statisticsGrid" class="grid grid-cols-2 lg:grid-cols-5 gap-3"></div>
</section>

<!-- DATA -->
<div id="dashboardSections" class="space-y-5"></div>

<!-- FOOTER -->
<div class="mt-8 pt-4 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-2 text-[10px] text-slate-400">

<div>
Source:
<a
id="sourceLink"
href="https://ibstpks.pelindo.co.id/webaccess/"
target="_blank"
rel="noopener noreferrer"
class="hover:text-slate-600 underline underline-offset-2 font-medium">
Pelindo TPKS Webaccess
</a>
</div>

<div class="flex items-center gap-2">
<span>Last update:</span>
<span id="lastUpdateText">—</span>
</div>

<div>
Next scraper:
<span id="nextUpdateText">—</span>
</div>

</div>
</main>

<!-- MODAL -->
<div
id="modalPanel"
class="modal-backdrop hidden"
onclick="handleBackdropClick(event)"
role="dialog"
aria-modal="true"
aria-labelledby="modalTitle">

<div class="modal-panel">
<div class="modal-header">

<div class="min-w-0">
<h2 id="modalTitle" class="modal-title">Vessel Detail</h2>
<div id="modalSubtitle" class="modal-subtitle"></div>
</div>

<button type="button" onclick="closeModal()" class="modal-close" aria-label="Close">
<i class="fa-solid fa-xmark"></i>
</button>

</div>

<div id="modalBody" class="modal-body"></div>
</div>
</div>

<script>
const DATA_URL="./data.json";

const SECTION_CONFIG=[
{
key:"vesselAlongside",
title:"Vessel Alongside",
icon:"fa-ship",
color:"border-blue-500 text-blue-600 bg-blue-50",
columns:[
["vesselName","Vessel Name"],
["voyage","Voyage"],
["type","Type"],
["atb","ATB"],
["etd","ETD"]
]
},
{
key:"confirmedVessel",
title:"Confirmed Vessel",
icon:"fa-circle-check",
color:"border-emerald-500 text-emerald-600 bg-emerald-50",
columns:[
["vesselName","Vessel Name"],
["voyage","Voyage"],
["type","Type"],
["etb","ETB"],
["etd","ETD"],
["openStack","Open Stack"],
["closingTime","Closing Time"],
["booking","Booking"],
["open","Open"],
["actual","Actual"]
]
},
{
key:"openStack",
title:"Open Stack",
icon:"fa-box-open",
color:"border-amber-500 text-amber-600 bg-amber-50",
columns:[
["vesselName","Vessel Name"],
["voyage","Voyage"],
["type","Type"],
["eta","ETA"],
["etb","ETB"],
["etd","ETD"],
["openStack","Open Stack"],
["closingTime","Closing Time"],
["booking","Booking"],
["open","Open"],
["actual","Actual"]
]
},
{
key:"vesselSchedule",
title:"Vessel Schedule",
icon:"fa-calendar-days",
color:"border-sky-500 text-sky-600 bg-sky-50",
columns:[
["vesselName","Vessel Name"],
["voyage","Voyage"],
["type","Type"],
["eta","ETA"],
["etb","ETB"],
["etd","ETD"]
]
},
{
key:"vesselHistory",
title:"Vessel History",
icon:"fa-clock-rotate-left",
color:"border-slate-500 text-slate-600 bg-slate-50",
columns:[
["vesselName","Vessel Name"],
["voyage","Voyage"],
["type","Type"],
["atb","ATB"],
["atd","ATD"],
["export","Export (Box/TEUs)"],
["import","Import (Box/TEUs)"]
]
}
];

let state={data:null};

function escapeHTML(value){
return String(value??"-")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function getValue(vessel,key){
return vessel?.[key]??"";
}

function formatCell(vessel,key){

const value=getValue(vessel,key);

if(key==="booking"||key==="open"||key==="actual"){
return value?escapeHTML(value):"-";
}

if(key==="export"){
if(!vessel.export)return "-";
return `${escapeHTML(vessel.export)} box / ${escapeHTML(vessel.exportTeus||"-")} TEUs`;
}

if(key==="import"){
if(!vessel.import)return "-";
return `${escapeHTML(vessel.import)} box / ${escapeHTML(vessel.importTeus||"-")} TEUs`;
}

if(key==="vesselName"){
const name=escapeHTML(vessel.vesselName||"-");
const code=vessel.vesselCode
?`<span class="text-[10px] text-slate-400">(${escapeHTML(vessel.vesselCode)})</span>`
:"";

return `<span class="font-bold text-slate-900">${name}</span> ${code}`;
}

if(key==="type"){
const type=String(vessel.type||"").toUpperCase();

if(!type)return "-";

const cls=type==="INTERNATIONAL"
?"bg-indigo-50 text-indigo-600 border-indigo-100"
:"bg-amber-50 text-amber-600 border-amber-100";

return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${cls} border">${escapeHTML(type)}</span>`;
}

return value?escapeHTML(value):"-";
}

async function loadData(){

const conn=document.getElementById("connectionText");
const icon=document.getElementById("refreshIcon");

if(conn)conn.innerText="Refreshing...";
if(icon)icon.classList.add("fa-spin");

try{

const res=await fetch(`${DATA_URL}?t=${Date.now()}`,{
cache:"no-store"
});

if(!res.ok)throw new Error(`HTTP ${res.status}`);

const json=await res.json();

if(!json||typeof json!=="object"){
throw new Error("Invalid JSON");
}

state.data=json;

renderKPI();
renderSections();
updateFooter();

if(conn){
conn.innerText="Connected";
conn.className="text-[10px] text-emerald-700 font-semibold px-3 py-1 bg-emerald-50 rounded-full border border-emerald-100";
}

}catch(error){

console.error("Failed to load data:",error);

if(conn){
conn.innerText="Offline / Error";
conn.className="text-[10px] text-red-600 font-semibold px-3 py-1 bg-red-50 rounded-full border border-red-100";
}

showErrorState();

}finally{

if(icon)icon.classList.remove("fa-spin");

}
}

function showErrorState(){

const container=document.getElementById("dashboardSections");

if(container){
container.innerHTML=`
<div class="bg-white border border-red-200 rounded-2xl p-8 text-center">
<div class="w-12 h-12 mx-auto mb-3 rounded-full bg-red-50 text-red-500 flex items-center justify-center">
<i class="fa-solid fa-triangle-exclamation"></i>
</div>
<h3 class="font-bold text-slate-800">Data tidak dapat dimuat</h3>
<p class="text-xs text-slate-400 mt-1">Periksa koneksi atau pastikan data.json tersedia.</p>
<button onclick="loadData()" class="mt-4 px-4 py-2 rounded-lg bg-blue-900 text-white text-xs font-bold">
<i class="fa-solid fa-rotate-right mr-1"></i>
Coba Lagi
</button>
</div>`;
}
}

function renderKPI(){

const grid=document.getElementById("statisticsGrid");

if(!grid||!state.data)return;

grid.innerHTML=SECTION_CONFIG.map(sec=>{

const list=Array.isArray(state.data[sec.key])
?state.data[sec.key]
:[];

const colorParts=sec.color.split(" ");

return`
<div
onclick="scrollToSection('${sec.key}')"
class="cursor-pointer bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition border-l-4 ${colorParts[0]}">

<div class="flex items-center justify-between text-xs text-slate-400 font-semibold mb-1">
<span>${escapeHTML(sec.title)}</span>
<i class="fa-solid ${sec.icon}"></i>
</div>

<div class="text-xl font-extrabold text-slate-900">
${list.length}
</div>

</div>`;

}).join("");
}

function renderSections(){

const container=document.getElementById("dashboardSections");

if(!container||!state.data)return;

container.innerHTML=SECTION_CONFIG.map(sec=>{

const list=Array.isArray(state.data[sec.key])
?state.data[sec.key]
:[];

return`
<section
id="sec-${sec.key}"
class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden fade-in">

<div class="sticky-header px-5 py-3.5 border-b border-slate-200 flex items-center justify-between gap-3">

<div class="flex items-center gap-2.5 min-w-0">

<span class="shrink-0 w-8 h-8 rounded-lg ${sec.color} flex items-center justify-center text-sm font-bold">
<i class="fa-solid ${sec.icon}"></i>
</span>

<div class="min-w-0">
<h2 class="font-bold text-slate-900 text-sm truncate">
${escapeHTML(sec.title)}
</h2>
</div>

</div>

<span
id="count-${sec.key}"
class="shrink-0 text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600">
${list.length} items
</span>

</div>

<div class="overflow-x-auto">

<table class="w-full text-left text-xs border-collapse">

<thead class="table-sticky-thead uppercase text-[10px] tracking-wider text-slate-400">
<tr>
${sec.columns.map(col=>`
<th class="px-4 py-3 font-bold border-b border-slate-200 whitespace-nowrap">
${escapeHTML(col[1])}
</th>
`).join("")}
</tr>
</thead>

<tbody
id="body-${sec.key}"
class="divide-y divide-slate-100 text-slate-700">

${
list.length===0
?`
<tr>
<td colspan="${sec.columns.length}" class="py-8 text-center text-slate-400">
<div class="flex flex-col items-center gap-2">
<i class="fa-solid fa-inbox text-lg"></i>
<span>No vessel data available</span>
</div>
</td>
</tr>
`
:
list.map((v,index)=>`
<tr
class="hover:bg-sky-50/50 cursor-pointer transition"
data-index="${index}"
data-section="${sec.key}">

${sec.columns.map(col=>`
<td class="px-4 py-3 whitespace-nowrap font-medium">
${formatCell(v,col[0])}
</td>
`).join("")}

</tr>
`).join("")
}

</tbody>
</table>
</div>

</section>`;

}).join("");

attachRowEvents();
}

function attachRowEvents(){

document.querySelectorAll("tbody tr[data-index]").forEach(row=>{

row.addEventListener("click",()=>{

const sectionKey=row.dataset.section;
const index=Number(row.dataset.index);

const sec=SECTION_CONFIG.find(s=>s.key===sectionKey);

if(!sec)return;

const list=state.data?.[sectionKey]||[];
const vessel=list[index];

if(vessel)openModal(vessel,sec.title);

});

});
}

function openModal(vessel,sectionName){

const modal=document.getElementById("modalPanel");
const title=document.getElementById("modalTitle");
const subtitle=document.getElementById("modalSubtitle");
const body=document.getElementById("modalBody");

if(!modal||!title||!subtitle||!body)return;

title.innerText=vessel.vesselName||"Vessel Detail";

subtitle.innerText=
`${sectionName} • Voyage: ${vessel.voyage||"-"}${vessel.vesselCode?" ("+vessel.vesselCode+")":""}`;

const fields=[
["Shipping Line","shippingLine"],
["Pelayaran","type"],
["ETA","eta"],
["ETB","etb"],
["ATB","atb"],
["ETD","etd"],
["ATD","atd"],
["Open Stack","openStack"],
["Closing Time","closingTime"]
];

let html=`
<div class="grid grid-cols-2 gap-3 text-xs">
`;

fields.forEach(([label,key])=>{

html+=`
<div class="p-2.5 bg-slate-50 rounded-lg">
<span class="text-slate-400 text-[10px] block">${label}</span>
<span class="font-bold text-slate-800">
${escapeHTML(vessel[key]||"-")}
</span>
</div>`;

});

html+=`
<div class="col-span-2 p-3 bg-blue-50/60 border border-blue-100 rounded-lg">
<span class="text-blue-500 text-[10px] block mb-1">
Booking / Open / Actual
</span>

<div class="grid grid-cols-3 gap-3 text-center">

<div>
<span class="block text-[9px] text-slate-400">Booking</span>
<strong class="text-blue-900">${escapeHTML(vessel.booking||"-")}</strong>
</div>

<div>
<span class="block text-[9px] text-slate-400">Open</span>
<strong class="text-blue-900">${escapeHTML(vessel.open||"-")}</strong>
</div>

<div>
<span class="block text-[9px] text-slate-400">Actual</span>
<strong class="text-blue-900">${escapeHTML(vessel.actual||"-")}</strong>
</div>

</div>
</div>
</div>
`;

body.innerHTML=html;
modal.classList.remove("hidden");
document.body.classList.add("overflow-hidden");
}

function closeModal(){

const modal=document.getElementById("modalPanel");

if(modal)modal.classList.add("hidden");

document.body.classList.remove("overflow-hidden");
}

function handleBackdropClick(event){

if(event.target.id==="modalPanel"){
closeModal();
}
}

function scrollToSection(key){

const el=document.getElementById(`sec-${key}`);

if(el){
el.scrollIntoView({
behavior:"smooth",
block:"start"
});
}
}

function updateFooter(){

if(!state.data)return;

const updated=
state.data.updatedAt||
state.data.lastUpdated||
state.data.scrapedAt||
"-";

const next=
state.data.nextUpdate||
state.data.nextScraper||
state.data.nextRun||
"-";

const last=document.getElementById("lastUpdateText");
const fresh=document.getElementById("freshnessText");
const nextEl=document.getElementById("nextUpdateText");

if(last)last.innerText=updated;
if(fresh)fresh.innerText=`Updated: ${updated}`;
if(nextEl)nextEl.innerText=next;
}

function getAllVessels(){

if(!state.data)return[];

const result=[];

SECTION_CONFIG.forEach(sec=>{

const list=Array.isArray(state.data[sec.key])
?state.data[sec.key]
:[];

list.forEach(v=>{

result.push({
...v,
_section:sec.key,
_sectionTitle:sec.title
});

});

});

return result;
}

function showSuggestions(){

const input=document.getElementById("searchInput");
const box=document.getElementById("searchSuggestions");

if(!input||!box)return;

const q=input.value.toLowerCase().trim();

if(!q||!state.data){
box.classList.add("hidden");
return;
}

const matches=getAllVessels()
.filter(v=>{

const text=[
v.vesselName,
v.voyage,
v.vesselCode,
v.type,
v.shippingLine
].filter(Boolean).join(" ").toLowerCase();

return text.includes(q);

})
.slice(0,8);

if(!matches.length){
box.innerHTML=`
<div class="p-4 text-xs text-slate-400 text-center">
<i class="fa-solid fa-magnifying-glass mb-1"></i>
<div>No matching vessel</div>
</div>`;
box.classList.remove("hidden");
return;
}

box.innerHTML=matches.map((v,index)=>`

<div
class="search-suggestion"
data-suggestion-index="${index}">

<div class="flex items-center justify-between gap-3">

<div class="min-w-0">
<div class="font-bold text-slate-800 truncate">
${escapeHTML(v.vesselName||"-")}
</div>

<div class="text-[10px] text-slate-400 mt-0.5">
Voyage: ${escapeHTML(v.voyage||"-")}
${v.vesselCode?" • "+escapeHTML(v.vesselCode):""}
</div>
</div>

<span class="shrink-0 text-[9px] px-2 py-1 rounded-full bg-slate-100 text-slate-500">
${escapeHTML(v._sectionTitle)}
</span>

</div>
</div>

`).join("");

box.classList.remove("hidden");

box.querySelectorAll("[data-suggestion-index]").forEach((el,i)=>{

el.addEventListener("click",()=>{

const vessel=matches[i];

input.value=vessel.vesselName||"";
box.classList.add("hidden");

performSearch();

});

});
}

function performSearch(){

const input=document.getElementById("searchInput");
const status=document.getElementById("searchStatus");
const clearBtn=document.getElementById("clearSearchButton");
const suggestions=document.getElementById("searchSuggestions");

if(!input||!state.data)return;

const q=input.value.toLowerCase().trim();

if(suggestions)suggestions.classList.add("hidden");

if(!q){

clearSearch();
return;
}

if(clearBtn)clearBtn.classList.remove("hidden");

let total=0;

SECTION_CONFIG.forEach(sec=>{

const body=document.getElementById(`body-${sec.key}`);
const count=document.getElementById(`count-${sec.key}`);

if(!body)return;

const rows=body.querySelectorAll("tr[data-index]");
let visible=0;

rows.forEach(row=>{

const text=row.innerText.toLowerCase();
const match=text.includes(q);

row.classList.toggle("table-row-hidden",!match);

if(match){
visible++;
total++;
}

});

if(count){
count.innerText=`${visible} / ${(state.data[sec.key]||[]).length} items`;
}

});

if(status){
status.innerText=
`${total} vessel ditemukan untuk "${input.value.trim()}"`;
}
}

function clearSearch(){

const input=document.getElementById("searchInput");
const clearBtn=document.getElementById("clearSearchButton");
const status=document.getElementById("searchStatus");
const suggestions=document.getElementById("searchSuggestions");

if(input)input.value="";
if(clearBtn)clearBtn.classList.add("hidden");
if(suggestions)suggestions.classList.add("hidden");
if(status)status.innerText="";

SECTION_CONFIG.forEach(sec=>{

const body=document.getElementById(`body-${sec.key}`);
const count=document.getElementById(`count-${sec.key}`);

if(body){

body.querySelectorAll("tr[data-index]").forEach(row=>{
row.classList.remove("table-row-hidden");
});

}

if(count){

const total=(state.data?.[sec.key]||[]).length;
count.innerText=`${total} items`;

}

});
}

document.addEventListener("DOMContentLoaded",()=>{

const input=document.getElementById("searchInput");

if(input){

input.addEventListener("input",()=>{

if(input.value.trim()){
showSuggestions();
}else{
clearSearch();
}

});

input.addEventListener("keydown",event=>{

if(event.key==="Enter"){
event.preventDefault();
performSearch();
}

if(event.key==="Escape"){
clearSearch();
input.blur();
}

});

input.addEventListener("focus",()=>{

if(input.value.trim()){
showSuggestions();
}

});

}

document.addEventListener("click",event=>{

const searchArea=document.querySelector(".relative");

if(
searchArea&&
!searchArea.contains(event.target)
){

document
.getElementById("searchSuggestions")
?.classList.add("hidden");

}

});

document.addEventListener("keydown",event=>{

if(event.key==="Escape"){
closeModal();
}

});

loadData();

});
</script>

</body>
</html>
