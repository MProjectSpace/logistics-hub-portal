<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TPKS Vessel Monitoring</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        /* =========================================================
           BASE
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 0% 0%,
                    rgba(59, 130, 246, 0.09),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 100% 8%,
                    rgba(14, 165, 233, 0.08),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(99, 102, 241, 0.05),
                    transparent 30%
                ),
                #f1f5f9;

            color: #0f172a;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        ::selection {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* =========================================================
           MAIN HEADER
           NOT STICKY
           ========================================================= */

        .main-header {
            position: relative;
            z-index: 10;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.97),
                    rgba(239, 246, 255, 0.94)
                );

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-bottom: 1px solid rgba(148, 163, 184, 0.22);
        }

        .brand-mark {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0891b2
                );

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.20);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .pulse-dot {
            background: #10b981;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulseLive 2s infinite;
        }

        @keyframes pulseLive {
            0% {
                box-shadow:
                    0 0 0 0 rgba(16, 185, 129, 0.45);
            }

            70% {
                box-shadow:
                    0 0 0 7px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow:
                    0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        /* =========================================================
           SEARCH
           ========================================================= */

        .search-section {
            position: relative;
            z-index: 40;
        }

        .search-wrapper {
            position: relative;
            z-index: 50;

            padding: 14px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(239, 246, 255, 0.94)
                );

            border: 1px solid rgba(148, 163, 184, 0.20);

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.06),
                0 2px 8px rgba(59, 130, 246, 0.04);
        }

        .search-input-wrap {
            position: relative;
        }

        .search-input {
            width: 100%;
            height: 44px;

            padding-left: 42px;
            padding-right: 42px;

            border-radius: 13px;

            background: white;
            border: 1px solid #dbeafe;

            color: #0f172a;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-input:focus {
            border-color: #60a5fa;

            box-shadow:
                0 0 0 4px rgba(59, 130, 246, 0.10),
                0 5px 15px rgba(59, 130, 246, 0.06);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);

            color: #64748b;

            pointer-events: none;
        }

        .clear-search-button {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 28px;
            height: 28px;

            border-radius: 9px;

            display: none;
            align-items: center;
            justify-content: center;

            color: #64748b;
            background: #f8fafc;

            transition: all 0.15s ease;
        }

        .clear-search-button:hover {
            color: #ef4444;
            background: #fef2f2;
        }

        .search-button {
            height: 44px;

            padding: 0 18px;

            border-radius: 13px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            color: white;
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0284c7
                );

            border: 1px solid rgba(37, 99, 235, 0.3);

            box-shadow:
                0 7px 16px rgba(37, 99, 235, 0.18);

            font-size: 12px;
            font-weight: 700;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .search-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 22px rgba(37, 99, 235, 0.23);
        }

        .refresh-button {
            height: 44px;

            padding: 0 16px;

            border-radius: 13px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            color: #334155;
            background: white;

            border: 1px solid #dbeafe;

            font-size: 12px;
            font-weight: 700;

            transition: all 0.15s ease;
        }

        .refresh-button:hover {
            color: #2563eb;
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .refresh-button.loading i {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           SEARCH SUGGESTIONS
           ========================================================= */

        .search-suggestions {
            position: absolute;

            top: calc(100% + 8px);
            left: 0;
            right: 0;

            z-index: 100;

            max-height: 390px;
            overflow-y: auto;

            border-radius: 17px;

            background: rgba(255, 255, 255, 0.98);

            border: 1px solid #dbeafe;

            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.14),
                0 5px 15px rgba(59, 130, 246, 0.08);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            overflow-x: hidden;
        }

        .suggestion-item {
            padding: 12px 14px;

            cursor: pointer;

            border-bottom: 1px solid #f1f5f9;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .suggestion-item:hover,
        .suggestion-item.active {
            background: #eff6ff;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-icon {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            color: #2563eb;
            background: #eff6ff;
        }

        /* =========================================================
           KPI / STATISTICS
           ========================================================= */

        .statistics-wrapper {
            position: relative;
            z-index: 10;
        }

        .stat-card {
            position: relative;

            overflow: hidden;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid rgba(148, 163, 184, 0.18);

            box-shadow:
                0 8px 25px rgba(15, 23, 42, 0.05);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .stat-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--accent-a),
                    var(--accent-b)
                );
        }

        .stat-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 14px 35px rgba(15, 23, 42, 0.09);

            border-color: #bfdbfe;
        }

        .stat-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            color: var(--accent-a);
            background: var(--accent-bg);
        }

        .stat-number {
            font-size: 24px;
            line-height: 1;

            font-weight: 800;

            color: #0f172a;
        }

        /* =========================================================
           SECTION
           ========================================================= */

        .dashboard-section {
            position: relative;

            scroll-margin-top: 8px;

            overflow: visible;
        }

        .section-card {
            position: relative;

            background: rgba(255, 255, 255, 0.97);

            border: 1px solid rgba(148, 163, 184, 0.20);

            border-radius: 20px;

            overflow: visible;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.05);
        }

        .section-header {
            position: sticky;

            top: 0;

            z-index: 30;

            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            padding: 14px 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(239, 246, 255, 0.96)
                );

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-bottom: 1px solid #dbeafe;

            border-radius: 20px 20px 0 0;
        }

        .section-title-icon {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #e0f2fe
                );

            color: #2563eb;

            box-shadow:
                0 5px 12px rgba(37, 99, 235, 0.10);
        }

        .section-count {
            padding: 5px 10px;

            border-radius: 999px;

            background: #eff6ff;

            color: #2563eb;

            border: 1px solid #dbeafe;

            font-size: 10px;
            font-weight: 800;

            white-space: nowrap;
        }

        .section-scroll {
            width: 100%;

            overflow-x: auto;
            overflow-y: visible;

            -webkit-overflow-scrolling: touch;
        }

        .section-scroll table {
            min-width: 760px;
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .section-scroll thead {
            position: sticky;

            top: 68px;

            z-index: 20;
        }

        .section-scroll thead th {
            padding: 11px 14px;

            background:
                linear-gradient(
                    180deg,
                    #f8fbff,
                    #eff6ff
                );

            color: #475569;

            border-bottom: 1px solid #dbeafe;

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 0.04em;

            white-space: nowrap;
        }

        .section-scroll tbody td {
            padding: 12px 14px;

            border-bottom: 1px solid #f1f5f9;

            color: #475569;

            font-size: 11px;

            vertical-align: middle;
        }

        .section-scroll tbody tr {
            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .section-scroll tbody tr:hover {
            background: #f8fbff;
        }

        .section-scroll tbody tr:last-child td {
            border-bottom: none;
        }

        .vessel-primary {
            color: #0f172a;
            font-size: 11px;
            font-weight: 800;
        }

        .vessel-secondary {
            margin-top: 2px;

            color: #94a3b8;

            font-size: 9px;
        }

        .voyage-badge {
            display: inline-flex;
            align-items: center;

            padding: 4px 7px;

            border-radius: 7px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            color: #475569;

            font-size: 10px;
            font-weight: 700;

            white-space: nowrap;
        }

        .type-badge {
            display: inline-flex;
            align-items: center;

            padding: 4px 7px;

            border-radius: 7px;

            background: #f0fdfa;

            border: 1px solid #ccfbf1;

            color: #0f766e;

            font-size: 9px;
            font-weight: 700;

            white-space: nowrap;
        }

        .datetime-value {
            color: #334155;
            font-size: 10px;
            white-space: nowrap;
        }

        /* =========================================================
           EMPTY STATE
           ========================================================= */

        .empty-state {
            padding: 38px 20px;

            text-align: center;

            color: #94a3b8;
        }

        .empty-icon {
            width: 46px;
            height: 46px;

            margin: 0 auto 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #f8fafc;

            color: #94a3b8;
        }

        /* =========================================================
           SEARCH HIT
           ========================================================= */

        .search-hit {
            animation: searchHit 3s ease;
        }

        @keyframes searchHit {
            0% {
                background: #bfdbfe;

                box-shadow:
                    inset 0 0 0 2px #60a5fa;
            }

            35% {
                background: #dbeafe;

                box-shadow:
                    inset 0 0 0 2px #93c5fd;
            }

            100% {
                background: transparent;

                box-shadow: none;
            }
        }

        /* =========================================================
           MODAL
           ========================================================= */

        .modal-backdrop {
            background:
                rgba(15, 23, 42, 0.50);

            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }

        .modal-card {
            width: min(700px, calc(100vw - 28px));

            max-height: min(88vh, 800px);

            overflow: hidden;

            background: #ffffff;

            border: 1px solid rgba(147, 197, 253, 0.35);

            border-radius: 24px;

            box-shadow:
                0 30px 80px rgba(15, 23, 42, 0.22),
                0 10px 30px rgba(37, 99, 235, 0.08);

            animation: modalIn 0.20s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f0f9ff,
                    #eef2ff
                );

            border-bottom: 1px solid #dbeafe;
        }

        .modal-section-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 6px 10px;

            border-radius: 999px;

            background: #dbeafe;

            color: #1d4ed8;

            border: 1px solid #bfdbfe;

            font-size: 10px;
            font-weight: 800;
        }

        .modal-vessel-name {
            margin-top: 10px;

            font-size: 21px;
            line-height: 1.2;

            font-weight: 800;

            color: #0f172a;
        }

        .modal-voyage {
            margin-top: 5px;

            font-size: 11px;

            color: #64748b;
        }

        .modal-body {
            padding: 18px;

            max-height: calc(88vh - 150px);

            overflow-y: auto;
        }

        .modal-field {
            padding: 11px 12px;

            border-radius: 12px;

            background: #f8fafc;

            border: 1px solid #f1f5f9;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .modal-field:hover {
            background: #f0f9ff;
            border-color: #dbeafe;
        }

        .modal-field-label {
            font-size: 9px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.04em;

            color: #94a3b8;
        }

        .modal-field-value {
            margin-top: 3px;

            font-size: 12px;

            font-weight: 600;

            color: #334155;

            word-break: break-word;
        }

        /* =========================================================
           CONNECTION STATUS
           ========================================================= */

        .connection-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 9px;
            font-weight: 700;
        }

        .connection-online {
            color: #047857;
            background: #ecfdf5;
            border: 1px solid #d1fae5;
        }

        .connection-loading {
            color: #0369a1;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
        }

        .connection-offline {
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        /* =========================================================
           FOOTER
           ========================================================= */

        .footer-link {
            color: #2563eb;
            transition: color 0.15s ease;
        }

        .footer-link:hover {
            color: #1d4ed8;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 768px) {

            .section-header {
                min-height: 62px;
                padding: 12px 14px;
            }

            .section-scroll thead {
                top: 62px;
            }

            .section-card {
                border-radius: 16px;
            }

            .modal-card {
                width: calc(100vw - 20px);
                border-radius: 20px;
            }

            .modal-header {
                padding: 16px;
            }

            .modal-body {
                padding: 14px;
            }

            .search-wrapper {
                padding: 10px;
            }
        }

        @media (max-width: 640px) {

            .stat-number {
                font-size: 21px;
            }

            .section-title-icon {
                width: 34px;
                height: 34px;
            }

            .section-header {
                gap: 10px;
            }

            .section-count {
                padding: 4px 8px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         MAIN HEADER
         ========================================================= -->

    <header class="main-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div class="py-5 flex items-center justify-between gap-4">

                <div class="flex items-center gap-3 min-w-0">

                    <div class="brand-mark">
                        <i class="fa-solid fa-ship"></i>
                    </div>

                    <div class="min-w-0">

                        <div class="flex items-center gap-3 flex-wrap">

                            <h1
                                class="
                                    text-lg
                                    sm:text-xl
                                    font-extrabold
                                    tracking-tight
                                    text-slate-900
                                "
                            >
                                TPKS Vessel Monitoring
                            </h1>

                            <span
                                class="
                                    inline-flex
                                    items-center
                                    gap-1.5
                                    px-2
                                    py-1
                                    rounded-full
                                    bg-emerald-50
                                    border
                                    border-emerald-100
                                    text-emerald-700
                                    text-[10px]
                                    font-bold
                                "
                            >
                                <span
                                    id="liveDot"
                                    class="status-dot pulse-dot"
                                ></span>

                                Live
                            </span>

                        </div>

                        <p class="mt-1 text-xs text-slate-500">
                            Pelindo Terminal Petikemas Semarang
                        </p>

                    </div>

                </div>

                <div class="hidden sm:flex items-center gap-2">

                    <span
                        id="connectionPill"
                        class="
                            connection-pill
                            connection-loading
                        "
                    >
                        <span class="status-dot bg-sky-500"></span>
                        <span id="connectionText">
                            Connecting...
                        </span>
                    </span>

                </div>

            </div>

        </div>
    </header>


    <!-- =========================================================
         MAIN
         ========================================================= -->

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-7">

        <!-- =====================================================
             SEARCH
             ===================================================== -->

        <section class="search-section mb-5">

            <div class="search-wrapper">

                <div class="flex flex-col sm:flex-row gap-2">

                    <div class="relative flex-1">

                        <div class="search-input-wrap">

                            <i
                                class="
                                    fa-solid
                                    fa-magnifying-glass
                                    search-icon
                                    text-sm
                                "
                            ></i>

                            <input
                                id="searchInput"
                                class="search-input"
                                type="text"
                                autocomplete="off"
                                placeholder="Search vessel, voyage, code, type..."
                                aria-label="Search vessel"
                            >

                            <button
                                id="clearSearchButton"
                                class="clear-search-button"
                                type="button"
                                onclick="clearSearch()"
                                aria-label="Clear search"
                            >
                                <i class="fa-solid fa-xmark text-sm"></i>
                            </button>

                        </div>

                        <!-- Suggestions -->
                        <div
                            id="searchSuggestions"
                            class="search-suggestions hidden"
                        ></div>

                    </div>

                    <button
                        id="searchButton"
                        type="button"
                        class="search-button"
                        onclick="performSearch()"
                    >
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Search</span>
                    </button>

                    <button
                        id="refreshButton"
                        type="button"
                        class="refresh-button"
                        onclick="loadData()"
                    >
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>Refresh</span>
                    </button>

                </div>

            </div>

            <div class="mt-2 flex items-center justify-between gap-3">

                <p
                    id="searchStatus"
                    class="text-[10px] text-slate-400"
                ></p>

                <p
                    id="freshnessText"
                    class="
                        text-[10px]
                        text-slate-400
                        text-right
                    "
                >
                    —
                </p>

            </div>

        </section>


        <!-- =====================================================
             STATISTICS
             ===================================================== -->

        <section class="statistics-wrapper mb-6">

            <div
                id="statistics"
                class="
                    grid
                    grid-cols-2
                    sm:grid-cols-3
                    lg:grid-cols-5
                    gap-3
                "
            ></div>

        </section>


        <!-- =====================================================
             DASHBOARD SECTIONS
             ===================================================== -->

        <div
            id="dashboardSections"
            class="space-y-5"
        ></div>


        <!-- =====================================================
             FOOTER
             ===================================================== -->

        <footer class="pt-7 pb-3">

            <div
                class="

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function normalizeSearchValue(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            return String(value)
                .toLowerCase()
                .trim();
        }


        function getVesselKey(vessel, sectionKey) {

            const name =
                normalizeSearchValue(
                    vessel?.vesselName
                );

            const code =
                normalizeSearchValue(
                    vessel?.vesselCode
                );

            const voyage =
                normalizeSearchValue(
                    vessel?.voyage
                );

            return [
                sectionKey,
                name,
                code,
                voyage
            ].join("|");
        }


        function getAllRecords() {

                    results.push({

                        section,

                        key: getVesselKey(
                            vessel,
                            section.key
                        )

                    });

                });

            });

            return results;

        /* =========================================================
           DATE / TIME
           ========================================================= */

        function parseDate(value) {

            if (!value) {
                return null;
            }

            if (value instanceof Date) {
                return value;
            }

            const text = String(value).trim();

            if (!text) {
                return null;
            }

            let normalized = text;

            if (
                /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(text)
            ) {
                normalized =
                    text.replace(" ", "T");
            }

            const date = new Date(normalized);

            if (!Number.isNaN(date.getTime())) {
                return date;
            }

            return null;
        }


        function formatDateTime(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "—";
            }

            const date = parseDate(value);

            if (!date) {
                return String(value);
            }

            try {

                return new Intl.DateTimeFormat(
                    "en-GB",
                    {
                        day: "2-digit",
                        month: "short",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                        hour12: false
                    }
                ).format(date);

            } catch {

                return String(value);

            }
        }


        function formatModalValue(key, value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "—";
            }

            if (
                [
                    "eta",
                    "etb",
                    "atb",
                    "etd",
                    "atd",
                    "openStack",
                    "closingTime"
                ].includes(key)
            ) {
                return formatDateTime(value);
            }

            return String(value);
        }


        function getFreshnessText(date) {

            if (!date) {
                return "Data time unavailable";
            }

            const now = Date.now();

            const diffMs =
                Math.max(
                    0,
                    now - date.getTime()
                );

            const diffSeconds =
                Math.floor(diffMs / 1000);

            if (diffSeconds < 30) {
                return "Updated just now";
            }

            if (diffSeconds < 60) {
                return `Updated ${diffSeconds}s ago`;
            }

            const diffMinutes =
                Math.floor(diffSeconds / 60);

            if (diffMinutes < 60) {
                return `Updated ${diffMinutes} min ago`;
            }

            const diffHours =
                Math.floor(diffMinutes / 60);

            if (diffHours < 24) {
                return `Updated ${diffHours}h ago`;
            }

            const diffDays =
                Math.floor(diffHours / 24);

            return `Updated ${diffDays}d ago`;
        }

                value === ""

        }


        /* =========================================================
           SEARCH ENGINE
           ========================================================= */

        function findSearchResults(query) {

            const normalizedQuery =
                normalizeSearchValue(query);

            if (!normalizedQuery) {
                return [];
            }

            const records =
                getAllRecords();

            const terms =
                normalizedQuery
                    .split(/\s+/)
                    .filter(Boolean);


            const scored = [];


            records.forEach(result => {

                const vessel =
                    result.vessel;

                const section =
                    result.section;


                const searchableFields = [

                    vessel.vesselName,

                    vessel.vesselCode,

                    vessel.voyage,

                    vessel.type,

                    vessel.shippingLine,

                    vessel.eta,

                    vessel.etb,

                    vessel.atb,

                    vessel.etd,

                    vessel.atd,

                    vessel.openStack,

                    vessel.closingTime,

                    vessel.booking,

                    vessel.open,

                    vessel.actual,

                    vessel.export,

                    vessel.exportTeus,

                    vessel.import,

                    vessel.importTeus,

                    section.title,

                    section.subtitle

                ]
                    .filter(
                        value =>
                            value !== null &&
                            value !== undefined
                    )
                    .map(
                        value =>
                            normalizeSearchValue(value)
                    );


                const searchableText =
                    searchableFields.join(" ");


                const allTermsMatch =
                    terms.every(
                        term =>
                            searchableText.includes(term)
                    );


                if (!allTermsMatch) {
                    return;
                }


                let score = 0;


                const name =
                    normalizeSearchValue(
                        vessel.vesselName
                    );

                const code =
                    normalizeSearchValue(
                        vessel.vesselCode
                    );

                const voyage =
                    normalizeSearchValue(
                        vessel.voyage
                    );

                const type =
                    normalizeSearchValue(
                        vessel.type
                    );

                const sectionTitle =
                    normalizeSearchValue(
                        section.title
                    );


                if (name === normalizedQuery) {
                    score += 1000;
                }

                if (code === normalizedQuery) {
                    score += 900;
                }

                if (voyage === normalizedQuery) {
                    score += 850;
                }

                if (
                    name.startsWith(
                        normalizedQuery
                    )
                ) {
                    score += 500;
                }

                if (
                    code.startsWith(
                        normalizedQuery
                    )
                ) {
                    score += 450;
                }

                if (
                    voyage.startsWith(
                        normalizedQuery
                    )
                ) {
                    score += 400;
                }

                if (
                    type.includes(
                        normalizedQuery
                    )
                ) {
                    score += 100;
                }

                if (
                    sectionTitle.includes(
                        normalizedQuery
                    )
                ) {
                    score += 80;
                }


                score += Math.max(
                    0,
                    50 - searchableText.indexOf(
                        normalizedQuery
                    )
                );


                scored.push({
                    ...result,
                    score
                });

            });


            scored.sort(
                (a, b) =>
                    b.score - a.score
            );


            return scored;
        }


        /* =========================================================
           SEARCH SUGGESTIONS
           ========================================================= */

        function updateSearchSuggestions() {

            if (!query) {

                hideSearchSuggestions();

                searchStatus.textContent = "";

                return;

            const results =
                findSearchResults(query);


            searchResults =

            activeSuggestionIndex = -1;


            if (!searchResults.length) {

                searchSuggestions.innerHTML = `

                        px-4

                        text-center
                    ">

                        <div
                            class="
                                mx-auto
                                w-9
                                h-9
                                rounded-xl
                                flex
                                items-center
                                justify-center
                                bg-slate-50
                                text-slate-300
                            "
                        >
                            <i class="
                                fa-solid
                                fa-magnifying-glass
                            "></i>
                        </div>

                        <div
                            class="
                                mt-2
                                text-xs
                                font-semibold
                                text-slate-500
                            "
                        >
                            No matching vessel
                        </div>

                        <div
                            class="
                                mt-1
                                text-[10px]
                                text-slate-400
                            "
                        >
                            Try another vessel name,
                            code, or voyage.
                        </div>

                    </div>

                `;

                searchSuggestions.classList.remove(
                    "hidden"
                );

                return;
            }


            searchSuggestions.innerHTML = "";


            searchResults.forEach(
                (result, index) => {

                    const vessel =
                        result.vessel;

                    const section =
                        result.section;


                    const item =
                        document.createElement("div");

                    item.className =
                        "suggestion-item";

                    item.dataset.index =
                        String(index);


                    item.innerHTML = `

                        <div class="
                            flex
                            items-center
                            gap-3
                        ">

                            <div class="suggestion-icon">

                                <i
                                    class="
                                        fa-solid
                                        ${section.icon}
                                        text-xs
                                    "
                                ></i>

                            </div>


                            <div class="
                                min-w-0
                                flex-1
                            ">

                                <div
                                    class="
                                        text-xs
                                        font-bold
                                        text-slate-800
                                        truncate
                                    "
                                >
                                    ${escapeHtml(
                                        vessel.vesselName ||
                                        "Unknown Vessel"
                                    )}
                                </div>

                                <div
                                    class="
                                        mt-0.5
                                        text-[10px]
                                        text-slate-500
                                        truncate
                                    "
                                >
                                    ${
                                        vessel.vesselCode
                                            ? escapeHtml(
                                                vessel.vesselCode
                                            )
                                            : "—"
                                    }

                                    ·

                                    Voyage ${
                                        vessel.voyage
                                            ? escapeHtml(
                                                vessel.voyage
                                            )
                                            : "—"
                                    }

                                </div>

                            </div>


                            <div
                                class="
                                    text-right
                                    shrink-0
                                "
                            >

                                <div
                                    class="
                                        text-[9px]
                                        font-bold
                                        text-blue-600
                                        max-w-[110px]
                                        truncate
                                    "
                                >
                                    ${escapeHtml(
                                        section.title
                                    )}
                                </div>

                                <div
                                    class="
                                        mt-1
                                        text-[9px]
                                        text-slate-300
                                    "
                                >
                                    <i
                                        class="
                                            fa-solid
                                            fa-chevron-right
                                        "
                                    ></i>
                                </div>

                            </div>

                        </div>

                    `;


                    /*
                     * IMPORTANT:
                     * Suggestion click = MODAL
                     * NOT scroll.
                     */

                    item.addEventListener(
                        "click",
                        () => {

                            openSearchSuggestion(
                                result
                            );

                        }
                    );


                    searchSuggestions.appendChild(
                        item
                    );

                }
            );


            searchSuggestions.classList.remove(
                "hidden"
            );
        }


        /* =========================================================
           SUGGESTION CLICK
           ========================================================= */

        function openSearchSuggestion(
            result
        ) {

            if (
                !result ||
                !result.vessel ||
                !result.section
            ) {
                return;
            }


            hideSearchSuggestions();


            openVesselModal(
                result.vessel,
                result.section
            );

        }


        /* =========================================================
           PERFORM SEARCH
           ENTER / SEARCH BUTTON
           = SCROLL TO ROW
           ========================================================= */

        function performSearch() {

            const query =
                searchInput.value.trim();


            if (!query) {

                searchStatus.textContent =
                    "Type a vessel, voyage, code, or type to search.";

                return;
            }


            const results =
                findSearchResults(query);


            if (!results.length) {

                searchStatus.textContent =
                    `No data found for "${query}"`;

                hideSearchSuggestions();

                return;
            }


            const result =
                results[0];


            hideSearchSuggestions();


            jumpToSearchResult(
                result
            );


            searchStatus.textContent =
                `${results.length} result${
                    results.length === 1
                        ? ""
                        : "s"
                } found`;

        }


        /* =========================================================
           JUMP TO SEARCH RESULT
           ========================================================= */

        function jumpToSearchResult(
            result
        ) {

            if (
                !result ||
                !result.vessel ||
                !result.section
            ) {
                return;
            }


            const key =
                getVesselKey(
                    result.vessel,
                    result.section.key
                );


            const row =
                document.querySelector(
                    `[data-vessel-key="${CSS.escape(key)}"]`
                );


            if (!row) {

                /*
                 * Fallback:
                 * If duplicate key exists unexpectedly,
                 * locate section and render state.
                 */

                scrollToSection(
                    result.section.key
                );

                return;
            }


            row.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });


            row.classList.remove(
                "search-hit"
            );


            void row.offsetWidth;


            row.classList.add(
                "search-hit"
            );


            setTimeout(
                () => {
                    row.classList.remove(
                        "search-hit"
                    );
                },
                3200
            );

        }


        /* =========================================================
           CLEAR SEARCH
           ========================================================= */

        function clearSearch() {

            searchInput.value = "";

            searchStatus.textContent = "";

            clearSearchButton.style.display =
                "none";

            hideSearchSuggestions();

            searchInput.focus();

        }


        /* =========================================================
           HIDE SUGGESTIONS
           ========================================================= */

        function hideSearchSuggestions() {

            searchSuggestions.classList.add(
                "hidden"
            );

            activeSuggestionIndex = -1;

        }


        /* =========================================================
           KEYBOARD SEARCH
           ========================================================= */

        searchInput.addEventListener(
            "input",
            () => {

                updateSearchSuggestions();

            }
        );


        searchInput.addEventListener(
            "keydown",
            event => {

                const isVisible =
                    !searchSuggestions.classList.contains(
                        "hidden"
                    );


                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    performSearch();

                    return;
                }


                if (
                    event.key === "Escape"
                ) {

                    hideSearchSuggestions();

                    return;
                }


                if (
                    event.key === "ArrowDown"
                ) {

                    if (!isVisible) {
                        return;
                    }

                    event.preventDefault();

                    moveSuggestion(
                        1
                    );

                    return;
                }


                if (
                    event.key === "ArrowUp"
                ) {

                    if (!isVisible) {
                        return;
                    }

                    event.preventDefault();

                    moveSuggestion(
                        -1
                    );

                    return;
                }

            }
        );


        function moveSuggestion(
            direction
        ) {

            if (!searchResults.length) {
                return;
            }


            activeSuggestionIndex +=
                direction;


            if (
                activeSuggestionIndex < 0
            ) {
                activeSuggestionIndex =
                    searchResults.length - 1;
            }


            if (
                activeSuggestionIndex >=
                searchResults.length
            ) {
                activeSuggestionIndex = 0;
            }


            const items =
                searchSuggestions.querySelectorAll(
                    ".suggestion-item"
                );


            items.forEach(
                (item, index) => {

                    item.classList.toggle(
                        "active",
                        index ===
                            activeSuggestionIndex
                    );

                }
            );


            const activeItem =
                items[
                    activeSuggestionIndex
                ];


            if (activeItem) {

                activeItem.scrollIntoView({
                    block: "nearest"
                });

            }

        }


        /* =========================================================
           CLICK OUTSIDE SEARCH
           ========================================================= */

        document.addEventListener(
            "click",
            event => {

                const wrapper =
                    document.querySelector(
                        ".search-wrapper"
                    );


                if (
                    wrapper &&
                    !wrapper.contains(
                        event.target
                    )
                ) {

                    hideSearchSuggestions();

                }

            }
        );


        /* =========================================================
           MODAL
           ========================================================= */

        function openVesselModal(
            vessel,
            section
        ) {

            const modal =
                document.getElementById(
                    "vesselModal"
                );


            if (
                !modal ||
                !vessel ||
                !section
            ) {
                return;
            }


            const sectionBadge =
                document.getElementById(
                    "modalSectionBadge"
                );

            const vesselName =
                document.getElementById(
                    "modalVesselName"
                );

            const voyage =
                document.getElementById(
                    "modalVoyage"
                );

            const body =
                document.getElementById(
                    "modalBody"
                );


            /* ---------------------------------------------
               Section
               --------------------------------------------- */

            sectionBadge.innerHTML = `

                <i
                    class="
                        fa-solid
                        ${section.icon}
                    "
                ></i>

                <span>
                    ${escapeHtml(
                        section.title
                    )}
                </span>

            `;


            /* ---------------------------------------------
               Vessel Name
               --------------------------------------------- */

            vesselName.textContent =
                vessel.vesselName ||
                "Unknown Vessel";


            /* ---------------------------------------------
               Voyage / Code
               --------------------------------------------- */

            const voyageParts = [];


            if (vessel.vesselCode) {

                voyageParts.push(
                    vessel.vesselCode
                );

            }


            if (vessel.voyage) {

                voyageParts.push(
                    `Voyage ${vessel.voyage}`
                );

            }


            voyage.textContent =
                voyageParts.length
                    ? voyageParts.join(" · ")
                    : "Vessel information";


            /* ---------------------------------------------
               Fields
               --------------------------------------------- */

            body.innerHTML = "";


            const availableFields =
                MODAL_FIELDS.filter(
                    ([key]) => {

                        const value =
                            vessel[key];

                        return (
                            value !==
                                undefined &&
                            value !== null &&
                            value !== ""
                        );

                    }
                );


            if (!availableFields.length) {

                body.innerHTML = `

                    <div class="
                        py-10
                        text-center
                        text-xs
                        text-slate-400
                    ">
                        No additional information
                        available.
                    </div>

                `;

            } else {

                const grid =
                    document.createElement("div");

                grid.className =
                    "grid grid-cols-1 sm:grid-cols-2 gap-2.5";


                availableFields.forEach(
                    ([key, label]) => {

                        const value =
                            vessel[key];


                        const field =
                            document.createElement(
                                "div"
                            );

                        field.className =
                            "modal-field";


                        field.innerHTML = `

                            <div class="modal-field-label">
                                ${escapeHtml(label)}
                            </div>

                            <div class="modal-field-value">
                                ${escapeHtml(
                                    formatModalValue(
                                        key,
                                        value
                                    )
                                )}
                            </div>

                        `;


                        grid.appendChild(
                            field
                        );

                    }
                );


                body.appendChild(
                    grid
                );

            }


            modal.classList.remove(
                "hidden"
            );


            document.body.classList.add(
                "overflow-hidden"
            );


            /*
             * Store currently opened record
             * for debugging / future extension.
             */

            modal.dataset.section =
                section.key;

            modal.dataset.vesselKey =
                getVesselKey(
                    vessel,
                    section.key
                );

        }


        function closeVesselModal() {

            const modal =
                document.getElementById(
                    "vesselModal"
                );


            modal.classList.add(
                "hidden"
            );


            document.body.classList.remove(
                "overflow-hidden"
            );

        }


        function handleModalBackdropClick(
            event
        ) {

            if (
                event.target.id ===
                "vesselModal"
            ) {

                closeVesselModal();

            }

        }


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    const modal =
                        document.getElementById(
                            "vesselModal"
                        );


                    if (
                        modal &&
                        !modal.classList.contains(
                            "hidden"
                        )
                    ) {

                        closeVesselModal();

                    }

                }

            }
        );


        /* =========================================================
           LOAD DATA
           ========================================================= */

        async function loadData() {

            setConnectionStatus(
                "loading"
            );


            refreshButton.classList.add(
                "loading"
            );


            const originalRefresh =
                refreshButton.innerHTML;


            refreshButton.innerHTML = `

                <i class="fa-solid fa-rotate-right"></i>

                <span>Loading...</span>

            `;


            try {

                const response =
                    await fetch(
                        `${DATA_URL}?t=${Date.now()}`,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                dashboardData = {

                    lastUpdated:
                        data.lastUpdated ||
                        data.updatedAt ||
                        null,

                    updatedAt:
                        data.updatedAt ||
                        data.lastUpdated ||
                        null,

                    source:
                        data.source ||
                        "",

                    vesselAlongside:
                        Array.isArray(
                            data.vesselAlongside
                        )
                            ? data.vesselAlongside
                            : [],

                    confirmedVessel:
                        Array.isArray(
                            data.confirmedVessel
                        )
                            ? data.confirmedVessel
                            : [],

                    openStack:
                        Array.isArray(
                            data.openStack
                        )
                            ? data.openStack
                            : [],

                    vesselSchedule:
                        Array.isArray(
                            data.vesselSchedule
                        )
                            ? data.vesselSchedule
                            : [],

                    vesselHistory:
                        Array.isArray(
                            data.vesselHistory
                        )
                            ? data.vesselHistory
                            : [],

                    counts:
                        data.counts || {}

                };


                updateStatistics();

                renderAllSections();

                updateFreshness();

                setConnectionStatus(
                    "online"
                );


                nextUpdateAt =
                    Date.now() +
                    AUTO_REFRESH_INTERVAL;


                searchStatus.textContent =
                    "";


            } catch (error) {

                console.error(
                    "Failed to load data:",
                    error
                );


                setConnectionStatus(
                    "offline"
                );


                searchStatus.textContent =
                    "Unable to load latest data.";


            } finally {

                refreshButton.classList.remove(
                    "loading"
                );


                refreshButton.innerHTML =
                    originalRefresh;

            }

        }


        /* =========================================================
           FRESHNESS
           ========================================================= */

        function updateFreshness() {

            const rawDate =
                dashboardData.lastUpdated ||
                dashboardData.updatedAt;


            const date =
                parseDate(rawDate);


            if (!date) {

                freshnessText.textContent =
                    "Data time unavailable";

                return;

            }


            freshnessText.textContent =
                getFreshnessText(date);

        }


        /* =========================================================
           NEXT UPDATE
           ========================================================= */

        function updateNextUpdate() {

            if (!nextUpdateAt) {

                return;

            }


            const remainingMs =
                Math.max(
                    0,
                    nextUpdateAt -
                        Date.now()
                );


            const remainingSeconds =
                Math.ceil(
                    remainingMs / 1000
                );


            const minutes =
                Math.floor(
                    remainingSeconds / 60
                );


            const seconds =
                remainingSeconds % 60;


            let text;


            if (
                minutes > 0
            ) {

                text =
                    `Next refresh in ${minutes}m ${String(
                        seconds
                    ).padStart(2, "0")}s`;

            } else {

                text =
                    `Next refresh in ${seconds}s`;

            }


            /*
             * Only append when there is no active
             * search result message.
             */

            if (
                !searchInput.value.trim()
            ) {

                const current =
                    freshnessText.textContent;


                if (
                    current &&
                    current !== "—"
                ) {

                    freshnessText.textContent =
                        `${current} · ${text}`;

                }

            }

        }


        /* =========================================================
           SCRAPER STATUS
           ========================================================= */

        async function loadScraperStatus() {

            /*
             * GitHub Pages cannot directly know GitHub Actions
             * status without an API/token.
             *
             * This lightweight function is intentionally kept
             * non-blocking.
             *
             * The dashboard connection status is based on
             * data.json availability.
             */

            return;

        }


        /* =========================================================
           TIMERS
           ========================================================= */

        function startTimers() {

            if (autoRefreshTimer) {

                clearInterval(
                    autoRefreshTimer
                );

            }


            if (freshnessTimer) {

                clearInterval(
                    freshnessTimer
                );

            }


            if (nextUpdateTimer) {

                clearInterval(
                    nextUpdateTimer
                );

            }


            if (scraperStatusTimer) {

                clearInterval(
                    scraperStatusTimer
                );

            }


            autoRefreshTimer =
                setInterval(
                    () => {

                        loadData();

                    },
                    AUTO_REFRESH_INTERVAL
                );


            freshnessTimer =
                setInterval(
                    () => {

                        updateFreshness();

                    },
                    FRESHNESS_INTERVAL
                );


            nextUpdateTimer =
                setInterval(
                    () => {

                        updateNextUpdate();

                    },
                    NEXT_UPDATE_INTERVAL
                );


            scraperStatusTimer =
                setInterval(
                    () => {

                        loadScraperStatus();

                    },
                    SCRAPER_STATUS_INTERVAL
                );

        }


        /* =========================================================
           INITIALIZATION
           ========================================================= */

        async function initialize() {

            nextUpdateAt =
                Date.now() +
                AUTO_REFRESH_INTERVAL;


            await loadData();


            loadScraperStatus();


            startTimers();


            updateNextUpdate();

        }


        initialize();

    </script>

</body>
