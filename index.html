<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pelindo TPKS Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.9);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            min-width: 1100px;
        }

        th {
            white-space: nowrap;
        }

        td {
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .section-card {
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .section-card:hover {
            transform: translateY(-1px);
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-lg">
        <div class="max-w-[1800px] mx-auto px-6 py-5">

            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">

                <div>
                    <div class="flex items-center gap-3">
                        <div
                            class="w-11 h-11 rounded-xl bg-white/10 flex items-center justify-center"
                        >
                            <i class="fa-solid fa-ship text-xl"></i>
                        </div>

                        <div>
                            <h1 class="text-2xl font-bold">
                                Pelindo TPKS
                            </h1>

                            <p class="text-slate-300 text-sm">
                                Vessel Monitoring Dashboard
                            </p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3">

                    <div
                        id="connectionStatus"
                        class="flex items-center gap-2 text-sm bg-white/10 px-4 py-2 rounded-lg"
                    >
                        <span
                            id="statusDot"
                            class="status-dot bg-yellow-400"
                        ></span>

                        <span id="statusText">
                            Loading...
                        </span>
                    </div>

                    <button
                        onclick="loadData(true)"
                        class="px-4 py-2 rounded-lg bg-white text-slate-900 hover:bg-slate-200 transition font-medium"
                    >
                        <i class="fa-solid fa-rotate-right mr-2"></i>
                        Refresh
                    </button>

                </div>

            </div>

        </div>
    </header>


    <!-- MAIN -->
    <main class="max-w-[1800px] mx-auto px-6 py-6">

        <!-- SEARCH -->
        <section class="glass rounded-2xl shadow-sm p-5 mb-6">

            <div class="flex flex-col lg:flex-row gap-4">

                <div class="flex-1 relative">

                    <i
                        class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
                    ></i>

                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Search vessel name, code, voyage, shipping line, type..."
                        class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400"
                        oninput="applySearch()"
                    >

                </div>

                <button
                    onclick="clearSearch()"
                    class="px-5 py-3 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 transition"
                >
                    <i class="fa-solid fa-xmark mr-2"></i>
                    Clear
                </button>

            </div>

            <div class="mt-3 text-sm text-slate-500">
                <span id="searchInfo">
                    Showing all vessels
                </span>
            </div>

        </section>


        <!-- STATISTICS -->
        <section class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-6">

            <div class="glass rounded-2xl p-5 shadow-sm">
                <p class="text-sm text-slate-500">
                    Vessel Alongside
                </p>

                <p
                    id="countAlongside"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </p>
            </div>


            <div class="glass rounded-2xl p-5 shadow-sm">
                <p class="text-sm text-slate-500">
                    Confirmed Vessel
                </p>

                <p
                    id="countConfirmed"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </p>
            </div>


            <div class="glass rounded-2xl p-5 shadow-sm">
                <p class="text-sm text-slate-500">
                    Open Stack
                </p>

                <p
                    id="countOpenStack"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </p>
            </div>


            <div class="glass rounded-2xl p-5 shadow-sm">
                <p class="text-sm text-slate-500">
                    Vessel Schedule
                </p>

                <p
                    id="countSchedule"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </p>
            </div>


            <div class="glass rounded-2xl p-5 shadow-sm">
                <p class="text-sm text-slate-500">
                    Vessel History
                </p>

                <p
                    id="countHistory"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </p>
            </div>

        </section>


        <!-- DATA SECTIONS -->
        <div id="sectionsContainer"></div>


        <!-- FOOTER -->
        <footer class="mt-8 pb-8 text-center text-sm text-slate-500">

            <p>
                Source:
                <strong>Pelindo TPKS WebAccess</strong>
            </p>

            <p class="mt-1">
                Last update:
                <span id="lastUpdate">-</span>
            </p>

        </footer>

    </main>


<script>

const DATA_FILE = "data.json";

let DATA = {
    updatedAt: "",
    source: "",
    vesselAlongside: [],
    confirmedVessel: [],
    openStack: [],
    vesselSchedule: [],
    vesselHistory: [],
    counts: {}
};


const SECTION_CONFIG = [

    {
        key: "vesselAlongside",
        title: "Vessel Alongside",
        icon: "fa-anchor",
        description: "Vessels currently alongside."
    },

    {
        key: "confirmedVessel",
        title: "Confirmed Vessel",
        icon: "fa-circle-check",
        description: "Confirmed vessel information."
    },

    {
        key: "openStack",
        title: "Open Stack",
        icon: "fa-box-open",
        description: "Vessels with open stack information."
    },

    {
        key: "vesselSchedule",
        title: "Vessel Schedule",
        icon: "fa-calendar-days",
        description: "Upcoming vessel schedule."
    },

    {
        key: "vesselHistory",
        title: "Vessel History",
        icon: "fa-clock-rotate-left",
        description: "Historical vessel movements."
    }

];


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "0";
    }

    const number = Number(value);

    if (Number.isNaN(number)) {
        return escapeHtml(value);
    }

    return number.toLocaleString("en-US");
}


function normalizeSearchValue(value) {

    return String(value ?? "")
        .toLowerCase()
        .trim();

}


function vesselMatches(vessel, query) {

    if (!query) {
        return true;
    }

    const searchable = Object.values(vessel)
        .map(value => normalizeSearchValue(value))
        .join(" ");

    return searchable.includes(query);
}


function renderTable(items) {

    if (!items || items.length === 0) {

        return `
            <div class="p-8 text-center text-slate-500">
                <i class="fa-solid fa-database text-3xl mb-3"></i>

                <p>
                    No data available.
                </p>
            </div>
        `;

    }


    return `

        <div class="table-wrapper">

            <table class="w-full text-sm">

                <thead class="bg-slate-100 border-b border-slate-200">

                    <tr>

                        <th class="px-4 py-3 text-left">
                            Vessel
                        </th>

                        <th class="px-4 py-3 text-left">
                            Code
                        </th>

                        <th class="px-4 py-3 text-left">
                            Voyage
                        </th>

                        <th class="px-4 py-3 text-left">
                            Shipping Line
                        </th>

                        <th class="px-4 py-3 text-left">
                            Type
                        </th>

                        <th class="px-4 py-3 text-left">
                            ETA
                        </th>

                        <th class="px-4 py-3 text-left">
                            ETB
                        </th>

                        <th class="px-4 py-3 text-left">
                            ATB
                        </th>

                        <th class="px-4 py-3 text-left">
                            ETD
                        </th>

                        <th class="px-4 py-3 text-left">
                            ATD
                        </th>

                        <th class="px-4 py-3 text-left">
                            Open Stack
                        </th>

                        <th class="px-4 py-3 text-left">
                            Closing
                        </th>

                        <th class="px-4 py-3 text-right">
                            Booking
                        </th>

                        <th class="px-4 py-3 text-right">
                            Open
                        </th>

                        <th class="px-4 py-3 text-right">
                            Actual
                        </th>

                        <th class="px-4 py-3 text-right">
                            Export
                        </th>

                        <th class="px-4 py-3 text-right">
                            Import
                        </th>

                    </tr>

                </thead>


                <tbody class="divide-y divide-slate-100">

                    ${items.map(vessel => `

                        <tr class="hover:bg-slate-50 transition">

                            <td class="px-4 py-3 font-semibold text-slate-900">
                                ${escapeHtml(vessel.vesselName)}
                            </td>

                            <td class="px-4 py-3">
                                ${escapeHtml(vessel.vesselCode)}
                            </td>

                            <td class="px-4 py-3 font-medium">
                                ${escapeHtml(vessel.voyage)}
                            </td>

                            <td class="px-4 py-3">
                                ${escapeHtml(vessel.shippingLine)}
                            </td>

                            <td class="px-4 py-3">

                                ${
                                    vessel.type
                                    ? `
                                        <span class="px-2 py-1 rounded-md bg-slate-100">
                                            ${escapeHtml(vessel.type)}
                                        </span>
                                      `
                                    : "-"
                                }

                            </td>

                            <td class="px-4 py-3">
                                ${escapeHtml(vessel.eta)}
                            </td>

                            <td class="px-4 py-3">
                                ${escapeHtml(vessel.etb)}
                            </td>

                            <td class="px-4 py-3">
                                ${escapeHtml(vessel.atb)}
                            </td>

                            <td class="px-4 py-3">
                                ${escapeHtml(vessel.etd)}
                            </td>

                            <td class="px-4 py-3">
                                ${escapeHtml(vessel.atd)}
                            </td>

                            <td class="px-4 py-3">
                                ${escapeHtml(vessel.openStack)}
                            </td>

                            <td class="px-4 py-3">
                                ${escapeHtml(vessel.closingTime)}
                            </td>

                            <td class="px-4 py-3 text-right">
                                ${formatNumber(vessel.booking)}
                            </td>

                            <td class="px-4 py-3 text-right">
                                ${formatNumber(vessel.open)}
                            </td>

                            <td class="px-4 py-3 text-right">
                                ${formatNumber(vessel.actual)}
                            </td>

                            <td class="px-4 py-3 text-right">
                                ${formatNumber(vessel.export)}
                            </td>

                            <td class="px-4 py-3 text-right">
                                ${formatNumber(vessel.import)}
                            </td>

                        </tr>

                    `).join("")}

                </tbody>

            </table>

        </div>
    `;

}


function renderSections() {

    const container =
        document.getElementById("sectionsContainer");

    const query =
        normalizeSearchValue(
            document.getElementById("searchInput").value
        );


    let totalVisible = 0;


    container.innerHTML = SECTION_CONFIG.map(section => {

        const source =
            Array.isArray(DATA[section.key])
                ? DATA[section.key]
                : [];


        const filtered =
            source.filter(vessel =>
                vesselMatches(vessel, query)
            );


        totalVisible += filtered.length;


        return `

            <section class="section-card glass rounded-2xl shadow-sm mb-6 overflow-hidden">

                <div class="px-5 py-4 border-b border-slate-200 bg-white">

                    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">

                        <div class="flex items-center gap-3">

                            <div
                                class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center"
                            >
                                <i class="fa-solid ${section.icon}"></i>
                            </div>

                            <div>

                                <h2 class="font-bold text-lg">
                                    ${section.title}
                                </h2>

                                <p class="text-sm text-slate-500">
                                    ${section.description}
                                </p>

                            </div>

                        </div>


                        <div class="text-sm">

                            <span class="px-3 py-1.5 rounded-lg bg-slate-100">

                                ${filtered.length}

                                ${
                                    query &&
                                    filtered.length !== source.length
                                    ? ` / ${source.length}`
                                    : ""
                                }

                                records

                            </span>

                        </div>

                    </div>

                </div>


                ${renderTable(filtered)}

            </section>

        `;

    }).join("");


    const searchInfo =
        document.getElementById("searchInfo");


    if (query) {

        searchInfo.textContent =
            `Search "${query}" — ${totalVisible} matching records`;

    } else {

        searchInfo.textContent =
            "Showing all vessels";

    }

}


function updateStatistics() {

    const counts = DATA.counts || {};


    document.getElementById("countAlongside").textContent =
        formatNumber(
            Array.isArray(DATA.vesselAlongside)
                ? DATA.vesselAlongside.length
                : counts.vesselAlongside || 0
        );


    document.getElementById("countConfirmed").textContent =
        formatNumber(
            Array.isArray(DATA.confirmedVessel)
                ? DATA.confirmedVessel.length
                : counts.confirmedVessel || 0
        );


    document.getElementById("countOpenStack").textContent =
        formatNumber(
            Array.isArray(DATA.openStack)
                ? DATA.openStack.length
                : counts.openStack || 0
        );


    document.getElementById("countSchedule").textContent =
        formatNumber(
            Array.isArray(DATA.vesselSchedule)
                ? DATA.vesselSchedule.length
                : counts.vesselSchedule || 0
        );


    document.getElementById("countHistory").textContent =
        formatNumber(
            Array.isArray(DATA.vesselHistory)
                ? DATA.vesselHistory.length
                : counts.vesselHistory || 0
        );

}


function updateLastUpdate() {

    const element =
        document.getElementById("lastUpdate");


    if (!DATA.updatedAt) {

        element.textContent = "-";
        return;

    }


    const date =
        new Date(DATA.updatedAt);


    if (Number.isNaN(date.getTime())) {

        element.textContent =
            DATA.updatedAt;

        return;

    }


    element.textContent =
        date.toLocaleString(
            "id-ID",
            {
                dateStyle: "medium",
                timeStyle: "medium"
            }
        );

}


function updateConnectionStatus(success) {

    const dot =
        document.getElementById("statusDot");

    const text =
        document.getElementById("statusText");


    if (success) {

        dot.className =
            "status-dot bg-green-400";

        text.textContent =
            "Connected";

    } else {

        dot.className =
            "status-dot bg-red-400";

        text.textContent =
            "Connection error";

    }

}


async function loadData(manual = false) {

    try {

        if (manual) {

            document.getElementById("statusText")
                .textContent = "Refreshing...";

        }


        const response =
            await fetch(
                `${DATA_FILE}?t=${Date.now()}`,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const json =
            await response.json();


        DATA = {
            updatedAt: json.updatedAt || "",
            source: json.source || "",
            vesselAlongside:
                Array.isArray(json.vesselAlongside)
                    ? json.vesselAlongside
                    : [],
            confirmedVessel:
                Array.isArray(json.confirmedVessel)
                    ? json.confirmedVessel
                    : [],
            openStack:
                Array.isArray(json.openStack)
                    ? json.openStack
                    : [],
            vesselSchedule:
                Array.isArray(json.vesselSchedule)
                    ? json.vesselSchedule
                    : [],
            vesselHistory:
                Array.isArray(json.vesselHistory)
                    ? json.vesselHistory
                    : [],
            counts: json.counts || {}
        };


        updateStatistics();
        updateLastUpdate();
        renderSections();
        updateConnectionStatus(true);


    } catch (error) {

        console.error(
            "Failed to load data.json:",
            error
        );


        updateConnectionStatus(false);


        document.getElementById(
            "sectionsContainer"
        ).innerHTML = `

            <div class="glass rounded-2xl p-10 text-center">

                <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-4"></i>

                <h2 class="text-xl font-bold mb-2">
                    Failed to load data
                </h2>

                <p class="text-slate-500">
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;

    }

}


function applySearch() {

    renderSections();

}


function clearSearch() {

    document.getElementById(
        "searchInput"
    ).value = "";

    renderSections();

}


document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadData();

        /*
         * Refresh dashboard every 5 minutes.
         * GitHub Actions updates data.json every 30 minutes.
         */
        setInterval(
            () => loadData(),
            5 * 60 * 1000
        );

    }
);

</script>

</body>
</html>
